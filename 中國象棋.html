            targetDiv.style.zIndex = '12';
            targetDiv.dataset.row = toR;
            targetDiv.dataset.col = toC;
        }
        
        lastMove = { fromR, fromC, toR, toC };
        
        setTimeout(() => {
            board[toR][toC] = board[fromR][fromC];
            board[fromR][fromC] = null;
            
            if (callback) callback();
        }, 250);
    }

    // ==========================================================================
    // 中國象棋規則引擎
    // ==========================================================================

    // 檢查某一位置是否在棋盤內
    function inBoard(r, c) {
        return r >= 0 && r < 10 && c >= 0 && c < 9;
    }

    // 獲取某一位置的棋子顏色
    function getSide(r, c) {
        if (!board[r][c]) return null;
        return board[r][c].split('_')[0]; // 'R' 或 'B'
    }

    // 生成某棋子的所有可行步法
    function getValidMoves(r, c) {
        const moves = [];
        const piece = board[r][c];
        if (!piece) return moves;

        const [side, type] = piece.split('_');

        switch (type) {
            case 'R': // 車 (Chariot)
                const dirsR = [[1,0], [-1,0], [0,1], [0,-1]];
                for (let d of dirsR) {
                    let nr = r + d[0];
                    let nc = c + d[1];
                    while (inBoard(nr, nc)) {
                        if (!board[nr][nc]) {
                            moves.push({r: nr, c: nc});
                        } else {
                            if (getSide(nr, nc) !== side) moves.push({r: nr, c: nc});
                            break;
                        }
                        nr += d[0];
                        nc += d[1];
                    }
                }
                break;

            case 'C': // 炮 (Cannon)
                const dirsC = [[1,0], [-1,0], [0,1], [0,-1]];
                for (let d of dirsC) {
                    let nr = r + d[0];
                    let nc = c + d[1];
                    let obstacleFound = false;
                    while (inBoard(nr, nc)) {
                        if (!obstacleFound) {
                            if (!board[nr][nc]) {
                                moves.push({r: nr, c: nc});
                            } else {
                                obstacleFound = true;
                            }
                        } else {
                            if (board[nr][nc]) {
                                if (getSide(nr, nc) !== side) moves.push({r: nr, c: nc});
                                break;
                            }
                        }
                        nr += d[0];
                        nc += d[1];
                    }
                }
                break;

            case 'H': // 馬 (Horse)
                const knightMoves = [
                    {dr: -2, dc: -1, legR: -1, legC: 0},
                    {dr: -2, dc: 1, legR: -1, legC: 0},
                    {dr: 2, dc: -1, legR: 1, legC: 0},
                    {dr: 2, dc: 1, legR: 1, legC: 0},
                    {dr: -1, dc: -2, legR: 0, legC: -1},
                    {dr: 1, dc: -2, legR: 0, legC: -1},
                    {dr: -1, dc: 2, legR: 0, legC: 1},
                    {dr: 1, dc: 2, legR: 0, legC: 1}
                ];
                for (let km of knightMoves) {
                    const nr = r + km.dr;
                    const nc = c + km.dc;
                    if (inBoard(nr, nc)) {
                        // 檢查絆馬腳
                        const legR = r + km.legR;
                        const legC = c + km.legC;
                        if (!board[legR][legC]) {
                            if (getSide(nr, nc) !== side) {
                                moves.push({r: nr, c: nc});
                            }
                        }
                    }
                }
                break;

            case 'E': // 相/象 (Elephant)
                const eleMoves = [[-2,-2], [-2,2], [2,-2], [2,2]];
                for (let em of eleMoves) {
                    const nr = r + em[0];
                    const nc = c + em[1];
                    if (inBoard(nr, nc)) {
                        // 檢查是否過河 (紅相不可上北方，黑象不可下南方)
                        if (side === 'R' && nr < 5) continue;
                        if (side === 'B' && nr > 4) continue;
                        // 檢查塞象眼
                        const eyeR = r + em[0]/2;
                        const eyeC = c + em[1]/2;
                        if (!board[eyeR][eyeC]) {
                            if (getSide(nr, nc) !== side) {
                                moves.push({r: nr, c: nc});
                            }
                        }
                    }
                }
                break;

            case 'A': // 仕/士 (Advisor)
                const advMoves = [[-1,-1], [-1,1], [1,-1], [1,1]];
                for (let am of advMoves) {
                    const nr = r + am[0];
                    const nc = c + am[1];
                    if (inBoard(nr, nc)) {
                        // 九宮格限制：c必須在3-5之間。r必須在：紅方7-9, 黑方0-2
                        if (nc < 3 || nc > 5) continue;
                        if (side === 'R' && (nr < 7 || nr > 9)) continue;
                        if (side === 'B' && (nr < 0 || nr > 2)) continue;

                        if (getSide(nr, nc) !== side) {
                            moves.push({r: nr, c: nc});
                        }
                    }
                }
                break;

            case 'G': // 帥/將 (General)
                const genMoves = [[-1,0], [1,0], [0,-1], [0,1]];
                for (let gm of genMoves) {
                    const nr = r + gm[0];
                    const nc = c + gm[1];
                    if (inBoard(nr, nc)) {
                        // 九宮格限制
                        if (nc < 3 || nc > 5) continue;
                        if (side === 'R' && (nr < 7 || nr > 9)) continue;
                        if (side === 'B' && (nr < 0 || nr > 2)) continue;

                        if (getSide(nr, nc) !== side) {
                            moves.push({r: nr, c: nc});
                        }
                    }
                }
                break;

            case 'P': // 兵/卒 (Soldier)
                if (side === 'R') {
                    // 紅兵向上走
                    if (inBoard(r - 1, c) && getSide(r - 1, c) !== 'R') {
                        moves.push({r: r - 1, c: c});
                    }
                    // 過河(row <= 4)後可橫著走
                    if (r <= 4) {
                        for (let dc of [-1, 1]) {
                            if (inBoard(r, c + dc) && getSide(r, c + dc) !== 'R') {
                                moves.push({r: r, c: c + dc});
                            }
                        }
                    }
                } else {
                    // 黑卒向下走
                    if (inBoard(r + 1, c) && getSide(r + 1, c) !== 'B') {
                        moves.push({r: r + 1, c: c});
                    }
                    // 過河(row >= 5)後可橫著走
                    if (r >= 5) {
                        for (let dc of [-1, 1]) {
                            if (inBoard(r, c + dc) && getSide(r, c + dc) !== 'B') {
                                moves.push({r: r, c: c + dc});
                            }
                        }
                    }
                }
                break;
        }

        // 過濾掉會被「王不見王」或讓主帥陷入將軍危機的走法
        return moves.filter(mv => {
            // 模擬這一步
            const tempSource = board[r][c];
            const tempTarget = board[mv.r][mv.c];
            board[r][c] = null;
            board[mv.r][mv.c] = tempSource;

            const isKingSafe = !isKingExposed(side) && !isGeneralFacing();

            // 還原棋盤
            board[r][c] = tempSource;
            board[mv.r][mv.c] = tempTarget;

            return isKingSafe;
        });
    }

    // 檢查某方的老將是否直接面臨將軍
    function isKingExposed(side) {
        // 尋找將軍的位置
        let kr = -1, kc = -1;
        const kingName = side + '_G';
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                if (board[r][c] === kingName) {
                    kr = r;
                    kc = c;
                    break;
                }
            }
            if (kr !== -1) break;
        }

        if (kr === -1) return false; // 老將不見了（理論上不可能，除非已被吃）

        // 掃描敵方所有棋子，看是否有棋子能走到老將的位置
        const enemySide = side === 'R' ? 'B' : 'R';
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                if (board[r][c] && board[r][c].startsWith(enemySide)) {
                    // 為了避免無窮遞迴，這裏不能使用 getValidMoves (它也包含了對 isKingExposed 的過濾)
                    // 所以我們使用一個簡化版的檢測：直接判斷該棋子走法的基本規則是否可以吃王
                    if (canPieceReach(r, c, kr, kc)) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    // 簡化的基礎規則碰撞檢測 (不含防禦防將檢測)，判斷 (r1, c1) 棋子是否可攻擊 (r2, c2)
    function canPieceReach(r1, c1, r2, c2) {
        const piece = board[r1][c1];
        if (!piece) return false;
        const [side, type] = piece.split('_');

        // 一般只關心攻擊路徑，此時 (r2, c2) 必定為對手棋子（包含王）
        switch (type) {
            case 'R': // 車
                if (r1 !== r2 && c1 !== c2) return false;
                return countObstacles(r1, c1, r2, c2) === 0;
            case 'C': // 炮
                if (r1 !== r2 && c1 !== c2) return false;
                return countObstacles(r1, c1, r2, c2) === 1; // 必須剛好隔一個炮架
            case 'H': // 馬
                const dr = Math.abs(r1 - r2);
                const dc = Math.abs(c1 - c2);
                if (!((dr === 2 && dc === 1) || (dr === 1 && dc === 2))) return false;
                // 檢查絆馬腳
                if (dr === 2) {
                    return !board[r1 + (r2 - r1)/2][c1];
                } else {
                    return !board[r1][c1 + (c2 - c1)/2];
                }
            case 'E': // 象
                if (Math.abs(r1 - r2) !== 2 || Math.abs(c1 - c2) !== 2) return false;
                return !board[(r1 + r2)/2][(c1 + c2)/2];
            case 'A': // 士
                return Math.abs(r1 - r2) === 1 && Math.abs(c1 - c2) === 1;
            case 'G': // 將
                return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
            case 'P': // 兵
                if (side === 'R') {
                    if (r1 - r2 === 1 && c1 === c2) return true;
                    if (r1 <= 4 && r1 === r2 && Math.abs(c1 - c2) === 1) return true;
                } else {
                    if (r2 - r1 === 1 && c1 === c2) return true;
                    if (r1 >= 5 && r1 === r2 && Math.abs(c1 - c2) === 1) return true;
                }
                return false;
        }
        return false;
    }

    // 計算兩個點之間的障礙棋子數量 (限同一直線)
    function countObstacles(r1, c1, r2, c2) {
        let count = 0;
        if (r1 === r2) {
            const minC = Math.min(c1, c2);
            const maxC = Math.max(c1, c2);
            for (let c = minC + 1; c < maxC; c++) {
                if (board[r1][c]) count++;
            }
        } else if (c1 === c2) {
            const minR = Math.min(r1, r2);
            const maxR = Math.max(r1, r2);
            for (let r = minR + 1; r < maxR; r++) {
                if (board[r][c1]) count++;
            }
        }
        return count;
    }

    // 檢查是否「王不見王」 (兩王同列且無子阻擋)
    function isGeneralFacing() {
        let grRed = -1, gcRed = -1;
        let grBlack = -1, gcBlack = -1;

        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                if (board[r][c] === 'R_G') { grRed = r; gcRed = c; }
                if (board[r][c] === 'B_G') { grBlack = r; gcBlack = c; }
            }
        }

        if (gcRed !== -1 && gcRed === gcBlack) {
            return countObstacles(grRed, gcRed, grBlack, gcBlack) === 0;
        }
        return false;
    }

    // 檢查某方是否有任何合法步子(無步可走則輸)
    function hasAnyValidMoves(side) {
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                if (board[r][c] && board[r][c].startsWith(side)) {
                    if (getValidMoves(r, c).length > 0) return true;
                }
            }
        }
        return false;
    }

    // ==========================================================================
    // AI 决策引擎 (極小化極大演算法 + Alpha-Beta 剪枝)
    // ==========================================================================

    // 各棋子基礎價值估值
    const PIECE_VALUES = {
        'G': 10000,
        'R': 90,
        'C': 45,
        'H': 40,
        'E': 20,
        'A': 20,
        'P': 10
    };

    // 估算當前局面分（AI為黑，黑得分越高越好，紅得分越低越好）
    function evaluateBoard(b) {
        let score = 0;
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                const piece = b[r][c];
                if (!piece) continue;
                const [side, type] = piece.split('_');
                let val = PIECE_VALUES[type] || 0;

                // 兵卒過河與位置微調權重
                if (type === 'P') {
                    if (side === 'R') {
                        val += (9 - r) * 1.5; // 越往前越有價值
                    } else {
                        val += r * 1.5;
                    }
                }

                if (side === 'B') score += val;
                else score -= val;
            }
        }
        return score;
    }

    // 遞迴 Alpha-Beta 搜尋
    function alphaBeta(b, depth, alpha, beta, isMaximizing) {
        if (depth === 0) {
            return { score: evaluateBoard(b) };
        }

        const side = isMaximizing ? 'B' : 'R';
        let bestMove = null;

        // 生成當前局面所有可能的可行步
        const allMoves = [];
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                if (b[r][c] && b[r][c].startsWith(side)) {
                    const validMoves = getValidMoves(r, c);
                    for (let m of validMoves) {
                        allMoves.push({from: {r, c}, to: m, piece: b[r][c]});
                    }
                }
            }
        }

        // 如果走完了或陷入絕境
        if (allMoves.length === 0) {
            return { score: isMaximizing ? -9000 : 9000 };
        }

        // 簡單排序以加速剪枝 (優先評估吃子動作)
        allMoves.sort((a, b) => {
            const valA = board[a.to.r][a.to.c] ? PIECE_VALUES[board[a.to.r][a.to.c].split('_')[1]] : 0;
            const valB = board[b.to.r][b.to.c] ? PIECE_VALUES[board[b.to.r][b.to.c].split('_')[1]] : 0;
            return valB - valA;
        });

        if (isMaximizing) {
            let maxEval = -Infinity;
            for (let mv of allMoves) {
                // 模擬移動
                const originTarget = b[mv.to.r][mv.to.c];
                b[mv.to.r][mv.to.c] = b[mv.from.r][mv.from.c];
                b[mv.from.r][mv.from.c] = null;

                const ev = alphaBeta(b, depth - 1, alpha, beta, false).score;

                // 復原
                b[mv.from.r][mv.from.c] = b[mv.to.r][mv.to.c];
                b[mv.to.r][mv.to.c] = originTarget;

                if (ev > maxEval) {
                    maxEval = ev;
                    bestMove = mv;
                }
                alpha = Math.max(alpha, ev);
                if (beta <= alpha) break; // Beta 剪枝
            }
            return { score: maxEval, move: bestMove };
        } else {
            let minEval = Infinity;
            for (let mv of allMoves) {
                const originTarget = b[mv.to.r][mv.to.c];
                b[mv.to.r][mv.to.c] = b[mv.from.r][mv.from.c];
                b[mv.from.r][mv.from.c] = null;

                const ev = alphaBeta(b, depth - 1, alpha, beta, true).score;

                b[mv.from.r][mv.from.c] = b[mv.to.r][mv.to.c];
                b[mv.to.r][mv.to.c] = originTarget;

                if (ev < minEval) {
                    minEval = ev;
                    bestMove = mv;
                }
                beta = Math.min(beta, ev);
                if (beta <= alpha) break; // Alpha 剪枝
            }
            return { score: minEval, move: bestMove };
        }
    }

    // AI 決定落子
    function makeAIMove() {
        if (turn !== 'B' || isAILocked) return;
        isAILocked = true;
        setCoachStatus("思索棋局中...");

        const diffSelect = document.getElementById('difficultySelect');
        const searchDepth = parseInt(diffSelect.value);

        // 使用非同步讓 UI 在 AI 思考時不要凍結
        setTimeout(() => {
            const result = alphaBeta(board, searchDepth, -Infinity, Infinity, true);
            if (result.move) {
                const { from, to, piece } = result.move;
                
                saveHistory();

                const isCap = board[to.r][to.c] !== null;
                const pName = getPieceSymbol(piece.split('_')[0], piece.split('_')[1]);
                const moveText = "黑 " + translateMove(from.r, from.c, to.r, to.c, pName);
                
                animateAndExecuteMove(from.r, from.c, to.r, to.c, () => {
                    moveHistory.push({
                        text: moveText,
                        boardState: JSON.stringify(board),
                        turn: 'R',
                        selectedPiece: null,
                        lastMove: JSON.parse(JSON.stringify(lastMove))
                    });

                    // 偵測將軍
                    if (isKingExposed('R')) {
                        AudioSystem.playWarning();
                        triggerCheckBanner();
                        setCoachExpression('danger');
                        triggerCoachSpeech("將軍！⚡", "小心！你正被 AI 將軍！趕快解圍！", "😰");
                    } else {
                        setCoachExpression('think');
                    }

                    turn = 'R';
                    renderBoard();
                    renderHistory();
                    checkGameEnd();
                    
                    currentBestMove = null;
                    setCoachStatus("等待你落子...");
                });

                if (isCap) AudioSystem.playCaptureSound();
                else AudioSystem.playMoveSound();
            }
            isAILocked = false;
        }, 300);
    }

    // 保存當前局盤以供悔棋
    function saveHistory() {
        history.push(JSON.stringify(board));
        if (history.length > 10) history.shift(); // 最多保存10步
    }

    // ==========================================================================
    // UI 渲染與使用者互動
    // ==========================================================================

    // 將棋盤行列座標對照為文字 (用於導師口頭指導)
    const CHINESE_COLS_RED = ['九', '八', '七', '六', '五', '四', '三', '二', '一'];
    const PIECE_NAMES = {
        'G': '主帥', 'A': '仕', 'E': '相', 'H': '馬', 'R': '車', 'C': '炮', 'P': '兵'
    };

    function translateMove(fromR, fromC, toR, toC, pName) {
        // 例：帥五平六, 炮二平五
        const charName = pName;
        const fromColName = CHINESE_COLS_RED[fromC];
        const toColName = CHINESE_COLS_RED[toC];
        let action = '';
        if (fromR === toR) {
            action = '平' + toColName;
        } else if (fromR > toR) {
            action = '進' + (fromR - toR); // 簡化為前進步數或直達位
        } else {
            action = '退' + (toR - fromR);
        }
        return `${charName}${fromColName}${action}`;
    }

    // 渲染整個棋盤
    function renderBoard() {
        const layer = document.getElementById('piecesLayer');
        layer.innerHTML = '';

        const boardWrapper = document.getElementById('boardWrapper');
        const mode = document.getElementById('gameModeSelect') ? document.getElementById('gameModeSelect').value : 'vs_ai';
        const isCartoon = document.getElementById('pieceSkinSelect') ? document.getElementById('pieceSkinSelect').value === 'cartoon' : false;

        // 渲染最後落子標記
        if (lastMove) {
            const startDot = document.createElement('div');
            startDot.className = 'last-move-marker start';
            startDot.style.left = `${5.55 + lastMove.fromC * 11.11}%`;
            startDot.style.top = `${5 + lastMove.fromR * 10}%`;
            layer.appendChild(startDot);
            
            const endDot = document.createElement('div');
            endDot.className = 'last-move-marker end';
            endDot.style.left = `${5.55 + lastMove.toC * 11.11}%`;
            endDot.style.top = `${5 + lastMove.toR * 10}%`;
            layer.appendChild(endDot);
        }

        // 取得當前選中棋子的合法移動路徑
        const validMoves = (selectedPiece && !isReviewMode) ? getValidMoves(selectedPiece.r, selectedPiece.c) : [];

        // 渲染塞象眼與絆馬腳警告標記
        if (selectedPiece && !isReviewMode) {
            const piece = board[selectedPiece.r][selectedPiece.c];
            if (piece) {
                const [side, type] = piece.split('_');
                if (type === 'H') {
                    // 馬的 8 個走子方向
                    const knightMoves = [
                        {dr: -2, dc: -1, legR: -1, legC: 0},
                        {dr: -2, dc: 1, legR: -1, legC: 0},
                        {dr: 2, dc: -1, legR: 1, legC: 0},
                        {dr: 2, dc: 1, legR: 1, legC: 0},
                        {dr: -1, dc: -2, legR: 0, legC: -1},
                        {dr: 1, dc: -2, legR: 0, legC: -1},
                        {dr: -1, dc: 2, legR: 0, legC: 1},
                        {dr: 1, dc: 2, legR: 0, legC: 1}
                    ];
                    for (let km of knightMoves) {
                        const nr = selectedPiece.r + km.dr;
                        const nc = selectedPiece.c + km.dc;
                        if (inBoard(nr, nc)) {
                            const legR = selectedPiece.r + km.legR;
                            const legC = selectedPiece.c + km.legC;
                            if (board[legR][legC]) {
                                // 絆馬腳！在馬腳處畫紅 X
                                const xDot = document.createElement('div');
                                xDot.className = 'blocker-marker';
                                xDot.textContent = '×';
                                xDot.style.left = `${5.55 + legC * 11.11}%`;
                                xDot.style.top = `${5 + legR * 10}%`;
                                layer.appendChild(xDot);
                            }
                        }
                    }
                } else if (type === 'E') {
                    // 象的 4 個走子方向
                    const eleMoves = [[-2,-2], [-2,2], [2,-2], [2,2]];
                    for (let em of eleMoves) {
                        const nr = selectedPiece.r + em[0];
                        const nc = selectedPiece.c + em[1];
                        if (inBoard(nr, nc)) {
                            const eyeR = selectedPiece.r + em[0]/2;
                            const eyeC = selectedPiece.c + em[1]/2;
                            if (board[eyeR][eyeC]) {
                                // 塞象眼！在象眼處畫紅 X
                                const xDot = document.createElement('div');
                                xDot.className = 'blocker-marker';
                                xDot.textContent = '×';
                                xDot.style.left = `${5.55 + eyeC * 11.11}%`;
                                xDot.style.top = `${5 + eyeR * 10}%`;
                                layer.appendChild(xDot);
                            }
                        }
                    }
                }
            }
        }

        // 檢查雙方將軍狀態
        const isRedChecked = isKingExposed('R');
        const isBlackChecked = isKingExposed('B');

        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                const p = board[r][c];
                if (p) {
                    const div = document.createElement('div');
                    div.dataset.row = r;
                    div.dataset.col = c;
                    
                    const [side, type] = p.split('_');
                    div.className = `piece ${side === 'R' ? 'red' : 'black'}`;
                    
                    // 動態加入將軍抖動特效
                    if (type === 'G') {
                        if ((side === 'R' && isRedChecked) || (side === 'B' && isBlackChecked)) {
                            div.classList.add('threatened-king');
                        }
                    }
                    
                    // Q版卡通風格
                    if (isCartoon) {
                        const info = CARTOON_PIECES[side + '_' + type];
                        div.innerHTML = `
                            <div class="cartoon-emoji">${info.emoji}</div>
                            <div class="cartoon-label">${info.label}</div>
                        `;
                        div.classList.add('cartoon-style');
                    } else {
                        div.textContent = getPieceSymbol(side, type);
                    }
                    
                    div.style.left = `${5.55 + c * 11.11}%`;
                    div.style.top = `${5 + r * 10}%`;

                    if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                        div.classList.add('selected');
                    }

                    // 點擊棋子事件
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (isAILocked || isReviewMode) return;

                        const isMyPiece = (mode === 'vs_ai' && side === 'R' && turn === 'R') ||
                                          (mode !== 'vs_ai' && side === turn);

                        if (isMyPiece) {
                            if (!TUTORIAL_INTRODUCED[type]) {
                                TUTORIAL_INTRODUCED[type] = true;
                                triggerCoachSpeech(`${getPieceSymbol(side, type)} 的走法教學`, TUTORIAL_TEXTS[type], "💡");
                                AudioSystem.playWarning();
                            }
                            selectedPiece = { r, c };
                            renderBoard();
                        } else if (selectedPiece) {
                            // 吃子
                            const canMove = validMoves.some(mv => mv.r === r && mv.c === c);
                            if (canMove) {
                                executePlayerMove(selectedPiece.r, selectedPiece.c, r, c);
                            }
                        }
                    });

                    layer.appendChild(div);
                }
            }
        }

        // 渲染可走位置點
        for (let mv of validMoves) {
            const dot = document.createElement('div');
            dot.className = 'move-marker';
            dot.style.left = `${5.55 + mv.c * 11.11}%`;
            dot.style.top = `${5 + mv.r * 10}%`;

            dot.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedPiece && !isReviewMode) {
                    executePlayerMove(selectedPiece.r, selectedPiece.c, mv.r, mv.c);
                }
            });
            layer.appendChild(dot);
        }

        // 更新狀態欄資訊
        const turnVal = document.getElementById('turnValue');
        if (mode === 'vs_ai') {
            if (turn === 'R') {
                turnVal.textContent = "您的回合 (紅)";
                turnVal.style.color = "#b32d2e";
            } else {
                turnVal.textContent = "AI 思考中 (黑)";
                turnVal.style.color = "#222222";
                if (document.getElementById('mainContainer').classList.contains('theme-modern')) {
                    turnVal.style.color = "#00f5ff";
                }
            }
        } else {
            if (turn === 'R') {
                turnVal.textContent = "紅方回合";
                turnVal.style.color = "#b32d2e";
            } else {
                turnVal.textContent = "黑方回合";
                turnVal.style.color = "#222222";
                if (document.getElementById('mainContainer').classList.contains('theme-modern')) {
                    turnVal.style.color = "#00f5ff";
                }
            }
        }
        
        // 重繪雷達射線
        drawRadar();
    }

    // 棋子文字顯示
    function getPieceSymbol(side, type) {
        const isModern = document.getElementById('mainContainer').classList.contains('theme-modern');
        if (side === 'R') {
            switch (type) {
                case 'G': return '帥';
                case 'A': return '仕';
                case 'E': return '相';
                case 'H': return '馬';
                case 'R': return '車';
                case 'C': return '炮';
                case 'P': return '兵';
            }
        } else {
            switch (type) {
                case 'G': return isModern ? '將' : '將';
                case 'A': return isModern ? '士' : '士';
                case 'E': return isModern ? '象' : '象';
                case 'H': return isModern ? '馬' : '馬';
                case 'R': return isModern ? '車' : '車';
                case 'C': return isModern ? '砲' : '砲';
                case 'P': return isModern ? '卒' : '卒';
            }
        }
        return '';
    }

    // 執行玩家移動
    function executePlayerMove(fromR, fromC, toR, toC) {
        if (isReviewMode) return;
        
        const mode = document.getElementById('gameModeSelect') ? document.getElementById('gameModeSelect').value : 'vs_ai';
        
        // 傳統棋局模式
        saveHistory();
        const isCap = board[toR][toC] !== null;
        
        // 檢查走法前，是否會造成重大自毀（大漏著）
        // 模擬這一步
        const pSource = board[fromR][fromC];
        const pTarget = board[toR][toC];
        board[fromR][fromC] = null;
        board[toR][toC] = pSource;

        let blunderWarning = false;
        let blunderMsg = "";

        if (['R_R', 'R_C', 'R_H'].includes(pSource)) {
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c] && board[r][c].startsWith('B')) {
                        if (canPieceReach(r, c, toR, toC)) {
                            blunderWarning = true;
                            blunderMsg = `等一下！如果你走這步，你的【${PIECE_NAMES[pSource.split('_')[1]]}】可能會被對方的【${PIECE_NAMES[board[r][c].split('_')[1]]}】直接吃掉喔！要不要再思考一下？`;
                            break;
                        }
                    }
                }
                if (blunderWarning) break;
            }
        }

        // 復原模擬
        board[fromR][fromC] = pSource;
        board[toR][toC] = pTarget;

        if (blunderWarning) {
            AudioSystem.playWarning();
            setCoachExpression('blunder');
            triggerCoachSpeech("⚠️ 注意！", blunderMsg, "😧");
        }

        const pName = getPieceSymbol(pSource.split('_')[0], pSource.split('_')[1]);
        const moveText = (pSource.split('_')[0] === 'R' ? '紅 ' : '黑 ') + translateMove(fromR, fromC, toR, toC, pName);

        animateAndExecuteMove(fromR, fromC, toR, toC, () => {
            const nextTurn = turn === 'R' ? 'B' : 'R';
            moveHistory.push({
                text: moveText,
                boardState: JSON.stringify(board),
                turn: nextTurn,
                selectedPiece: null,
                lastMove: JSON.parse(JSON.stringify(lastMove))
            });

            // 偵測將軍
            const opponentSide = pSource.startsWith('R') ? 'B' : 'R';
            if (isKingExposed(opponentSide)) {
                AudioSystem.playWarning();
                triggerCheckBanner();
                setCoachExpression('danger');
                triggerCoachSpeech("將軍！⚡", `小心！${opponentSide === 'R' ? '紅方' : '黑方'}被將軍了！`, "😰");
            } else {
                setCoachExpression('smile');
            }

            turn = nextTurn;
            renderBoard();
            renderHistory();
            
            if (checkGameEnd()) return;

            if (mode === 'vs_ai' && turn === 'B') {
                makeAIMove();
            } else {
                setCoachStatus(`等待${turn === 'R' ? '紅方' : '黑方'}落子...`);
            }
        });

        if (isCap) AudioSystem.playCaptureSound();
        else AudioSystem.playMoveSound();

        selectedPiece = null;
    }

    // 檢查遊戲是否結束
    function checkGameEnd() {
        if (!hasAnyValidMoves('R')) {
            triggerCoachSpeech("棋局結束", "承讓了！你已經下得非常出色，只要多多練習，下次一定能戰勝我！要不要重來一局？", "😊");
            alert("遊戲結束，黑方(AI)獲勝！");
            return true;
        }
        if (!hasAnyValidMoves('B')) {
            triggerCoachSpeech("你太強了！", "哇！太厲害了！你居然擊敗了我！小棋士前途無量啊！🎉", "🎉");
            alert("恭喜你！紅方(玩家)獲勝！");
            return true;
        }
        return false;
    }

    // ==========================================================================
    // 指導棋 (Hint Generator) 核心思維導向提示
    // ==========================================================================

    function getCoachAdvice() {
        const activeSide = turn; // 'R' or 'B'
        const enemySide = activeSide === 'R' ? 'B' : 'R';
        
        const activeName = activeSide === 'R' ? '紅方' : '黑方';
        const enemyName = enemySide === 'R' ? '紅方' : '黑方';

        // 1. 如果自己正處於被「將軍」狀態
        if (isKingExposed(activeSide)) {
            return {
                title: `${activeName}主帥危急！`,
                text: `${activeName}的主帥正被對方的棋子將軍！當務之急是趕快調配「仕」、「相」護駕，或者直接讓主帥移動到安全、有遮擋的地方。先保護好自己再想進攻吧！`,
                expression: "😰"
            };
        }

        // 2. 探測是否有吃對方高價值大子的好機會 (車、馬、炮)
        let bestCapture = null;
        let capVal = 0;
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                if (board[r][c] && board[r][c].startsWith(activeSide)) {
                    const moves = getValidMoves(r, c);
                    for (let m of moves) {
                        const target = board[m.r][m.c];
                        if (target && target.startsWith(enemySide)) {
                            const tType = target.split('_')[1];
                            const tVal = PIECE_VALUES[tType];
                            if (tVal > capVal) {
                                capVal = tVal;
                                bestCapture = { from: {r, c}, to: m, pType: board[r][c].split('_')[1], tType };
                            }
                        }
                    }
                }
            }
        }

        if (bestCapture && capVal >= 40) {
            const pName = PIECE_NAMES[bestCapture.pType];
            const tName = PIECE_NAMES[bestCapture.tType];
            return {
                title: "發現進攻機會！",
                text: `小棋士，仔細觀察棋盤，你的【${pName}】似乎有機會可以瞄準並奪取對方的【${tName}】喔！進攻是最好的防禦，看看你能不能發現這一步？`,
                expression: "💡"
            };
        }

        // 3. 探測我方大子是否正處在危險中 (被捉)
        let majorThreatened = null;
        let threatVal = 0;
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                if (board[r][c] && board[r][c].startsWith(enemySide)) {
                    const moves = getValidMoves(r, c);
                    for (let m of moves) {
                        const target = board[m.r][m.c];
                        if (target && target.startsWith(activeSide)) {
                            const tType = target.split('_')[1];
                            const tVal = PIECE_VALUES[tType];
                            if (tVal > threatVal && ['R', 'C', 'H'].includes(tType)) {
                                threatVal = tVal;
                                majorThreatened = { targetName: PIECE_NAMES[tType], r: m.r, c: m.c };
                            }
                        }
                    }
                }
            }
        }

        if (majorThreatened) {
            return {
                title: "注意防守！",
                text: `不太妙！你的【${majorThreatened.targetName}】（在第 ${10 - majorThreatened.r} 列附近）現在正被對方死死盯著呢。趕快想想怎麼用其他的棋子擋住攻勢，或者優雅地退回安全的地方吧！`,
                expression: "⚠️"
            };
        }

        // 4. 開局大子動員提醒
        if (activeSide === 'R') {
            if (board[9][0] === 'R_R' && getValidMoves(9, 0).length > 0) {
                return {
                    title: "戰略建議",
                    text: "兵書上有說：『三步不出車，必定要輸棋。』你左下角的【車】還在打瞌睡呢！趕快找機會把它開出通道、加入戰局，它會是你最強大的戰鬥力！",
                    expression: "🤔"
                };
            }
            if (board[9][8] === 'R_R' && getValidMoves(9, 8).length > 0) {
                return {
                    title: "戰略建議",
                    text: "兵書有云：『車行直路。』你右下角的強力【車】還被關在角落裡。試著移動前方的棋子，幫你的【車】打通一條寬敞的進擊道路吧！",
                    expression: "🤔"
                };
            }
        } else {
            if (board[0][0] === 'B_R' && getValidMoves(0, 0).length > 0) {
                return {
                    title: "戰略建議",
                    text: "『車無遲道。』黑方左上角的【車】似乎還在角落。可以試著為它開闢通道，讓它馳騁戰場！",
                    expression: "🤔"
                };
            }
        }

        // 5. 如果以上都沒發生，利用 AI 優化一步，並轉化為「引導式文字提示」
        const result = alphaBeta(board, 2, -Infinity, Infinity, activeSide === 'B');
        if (result.move) {
            const { from, to, piece } = result.move;
            const pType = piece.split('_')[1];
            const pName = PIECE_NAMES[pType];

            switch (pType) {
                case 'P':
                    return {
                        title: "思路提示",
                        text: "俗話說：『過河的卒子頂半個車。』現在局勢平穩，考慮把你的【兵】往前推進，或者把它送過河，這能給對手製造很大的防禦壓力喔！",
                        expression: "🤔"
                    };
                case 'H':
                    return {
                        title: "思路提示",
                        text: "『八面威風馬。』此時調動你的【馬】跳到開闊的中央地帶，不僅能威脅對方，還能看守好自己的家園。找找看有沒有哪匹馬適合跑起來？",
                        expression: "😊"
                    };
                case 'C':
                    return {
                        title: "思路提示",
                        text: "炮需要『炮架子』才能發揮威力。試著將你的【炮】移動到合適的縱列，藏在其他棋子後面，靜靜等待最佳的狙擊時刻吧！",
                        expression: "💡"
                    };
                case 'E':
                case 'A':
                    return {
                        title: "思路提示",
                        text: "家園的安全是勝利的保證。目前對方的攻勢蠢蠢欲動，建議補上一手【仕】或【相】，構築起一道堅固的銅牆鐵壁，讓對手無機可乘！",
                        expression: "😊"
                    };
                default:
                    return {
                        title: "大局觀提示",
                        text: "現在是整理陣型的極佳時機。可以考慮穩穩地將【車】放到最開闊的大道上，牢牢控制主動權。仔細看好哪一條直路最暢通！",
                        expression: "😊"
                    };
            }
        }

        // 最終保底提示
        return {
            title: "導師提示",
            text: "下棋就像一場博弈。每一著都要想想：『我想進攻哪裡？』和『對手想吃我哪裡？』。看準了再落子，加油！",
            expression: "👴"
        };
    }

    // 觸發導師發言動畫與文字
    function triggerCoachSpeech(title, text, emoji) {
        const name = document.getElementById('coachName');
        const bubble = document.getElementById('coachBubble');

        const isModern = document.getElementById('mainContainer').classList.contains('theme-modern');
        name.textContent = (isModern ? "水墨貓導師" : "孔明貓教練") + " " + emoji;
        
        // 打字機效果
        bubble.textContent = '';
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                bubble.textContent += text.charAt(i);
                i++;
                setTimeout(typeWriter, 15);
            }
        }
        typeWriter();
    }

    function setCoachStatus(status) {
        document.getElementById('coachStatus').textContent = status;
    }

    // ==========================================================================
    // 初始化事件與主題切換
    // ==========================================================================

    document.getElementById('themeSwitch').addEventListener('change', function(e) {
        const container = document.getElementById('mainContainer');
        const coachName = document.getElementById('coachName');

        if (e.target.checked) {
            container.classList.add('theme-modern');
            coachName.textContent = "水墨貓導師";
            const mode = document.getElementById('gameModeSelect').value;
            document.getElementById('levelValue').textContent = "水墨大師棋力";
        } else {
            container.classList.remove('theme-modern');
            coachName.textContent = "孔明貓教練";
            const mode = document.getElementById('gameModeSelect').value;
            document.getElementById('levelValue').textContent = "入門棋力";
        }
        renderBoard();
    });

    document.getElementById('hintBtn').addEventListener('click', () => {
        if (isAILocked || isReviewMode) return;
        
        const mode = document.getElementById('gameModeSelect') ? document.getElementById('gameModeSelect').value : 'vs_ai';
        
        if (mode === 'vs_ai' && turn !== 'R') return; // AI模式下只有玩家回合能請教

        // 取得教練思路
        const advice = getCoachAdvice();
        setCoachExpression(advice.expression === '😰' ? 'danger' : (advice.expression === '⚠️' ? 'blunder' : 'think'));
        triggerCoachSpeech(advice.title, advice.text, advice.expression);

        // 給按鈕加上發光特效動畫
        const btn = document.getElementById('hintBtn');
        btn.classList.add('hint-pulse');
        setTimeout(() => btn.classList.remove('hint-pulse'), 1500);
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (isReviewMode) {
            exitReviewMode();
            return;
        }
        if (history.length === 0 || isAILocked) return;
        
        const mode = document.getElementById('gameModeSelect') ? document.getElementById('gameModeSelect').value : 'vs_ai';
        if (mode === 'vs_ai') {
            if (history.length >= 2) {
                history.pop();
                board = JSON.parse(history.pop());
                
                moveHistory.pop();
                moveHistory.pop();
            } else {
                board = JSON.parse(INITIAL_BOARD);
                history = [];
                moveHistory = [];
            }
            turn = 'R';
        } else {
            board = JSON.parse(history.pop());
            moveHistory.pop();
            turn = turn === 'R' ? 'B' : 'R';
        }
        
        // 更新最後落子指示器
        if (moveHistory.length > 0) {
            const lastStep = moveHistory[moveHistory.length - 1];
            lastMove = lastStep.lastMove;
        } else {
            lastMove = null;
        }
        
        selectedPiece = null;
        setCoachExpression('smile');
        renderBoard();
        renderHistory();
        triggerCoachSpeech("悔棋成功", "沒關係！指導棋的目的就是多嘗試、不怕走錯。重來一次，這次仔細想想剛才的思路喔！", "😊");
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
        if (confirm("確定要重開一局嗎？")) {
            const mode = document.getElementById('gameModeSelect').value;
            
            
            board = JSON.parse(JSON.stringify(INITIAL_BOARD));
            history = [];
            moveHistory = [];
            selectedPiece = null;
            lastMove = null;
            turn = 'R';
            isReviewMode = false;
            liveGameState = null;
            document.getElementById('exitReviewBtn').style.display = 'none';
            
            for (let k in TUTORIAL_INTRODUCED) {
                TUTORIAL_INTRODUCED[k] = false;
            }
            
            setCoachExpression('smile');
            renderBoard();
            renderHistory();
            triggerCoachSpeech("新局開始", "好！我們重新開局，整理好心情，這次一定會有更精采的發揮！紅方先走，請出招！", "😸");
        }
    });

    document.getElementById('difficultySelect').addEventListener('change', (e) => {
        const val = e.target.value;
        const levelVal = document.getElementById('levelValue');
        const mode = document.getElementById('gameModeSelect') ? document.getElementById('gameModeSelect').value : 'vs_ai';
        if (mode === 'vs_ai') {
            if (val === "1") {
                levelVal.textContent = "初學棋力";
            } else if (val === "2") {
                levelVal.textContent = "入門棋力";
            } else if (val === "3") {
                levelVal.textContent = "精英棋力";
            } else {
                levelVal.textContent = "大師棋力";
            }
        }
    });

    document.getElementById('gameModeSelect').addEventListener('change', (e) => {
        const mode = e.target.value;
        const levelVal = document.getElementById('levelValue');
        const diffContainer = document.getElementById('difficultyContainer');
        
        isReviewMode = false;
        liveGameState = null;
        document.getElementById('exitReviewBtn').style.display = 'none';
        lastMove = null;
        moveHistory = [];
        history = [];
        

        
        // 傳統象棋模式
        diffContainer.style.display = 'flex';
        board = JSON.parse(JSON.stringify(INITIAL_BOARD));
        turn = 'R';
        selectedPiece = null;
        
        if (mode === 'vs_ai') {
            const diffSelect = document.getElementById('difficultySelect');
            const val = diffSelect.value;
            if (val === "1") levelVal.textContent = "初學棋力";
            else if (val === "2") levelVal.textContent = "入門棋力";
            else if (val === "3") levelVal.textContent = "精英棋力";
            else levelVal.textContent = "大師棋力";
            
            setCoachExpression('smile');
            triggerCoachSpeech("模式切換", "現在切換成單人對戰 AI 模式囉！我是你的指導教練，紅方先走，請起步！", "😸");
        } else if (mode === 'two_players') {
            levelVal.textContent = "雙人對弈";
            setCoachExpression('smile');
            triggerCoachSpeech("模式切換", "開啟了【雙人對弈・朋友齊玩】模式！現在你可以和好朋友一起在同一個螢幕上下棋。兩邊都可以點【請教教練】來獲取專屬的引導思路喔！", "🤝");
        } else {
            levelVal.textContent = "自主練習";
            setCoachExpression('think');
            triggerCoachSpeech("模式切換", "開啟了【只提示不代下】練習模式！你可以自由操控紅黑雙方的移動，隨時點選【請教教練】，我會針對當前的下棋方給出引導想法！", "💡");
        }
        
        renderBoard();
        renderHistory();
    });

    document.getElementById('pieceSkinSelect').addEventListener('change', () => {
        renderBoard();
    });

    document.getElementById('radarSwitch').addEventListener('change', () => {
        drawRadar();
    });

    document.getElementById('exitReviewBtn').addEventListener('click', () => {
        exitReviewMode();
    });

    // 啟動遊戲
    renderBoard();
</script>

</body>
</html>
