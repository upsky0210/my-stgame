<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>象棋 AI 智能指導棋</title>
    <!-- 引入炫酷的科技感字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           全域變數與主題設定
           ========================================================================== */
        :root {
            /* 古典風變數 */
            --bg-color: #f4eae1;
            --container-bg: #fffdfa;
            --panel-bg: #efe3d5;
            --board-bg: #e6cbab;
            --board-line: #5c3e21;
            --text-color: #4a2c11;
            --primary-btn: #8a3324;
            --primary-btn-hover: #a13d2d;
            --btn-text: #ffffff;
            --accent-color: #d4a373;
            --shadow-color: rgba(92, 62, 33, 0.2);
            --font-main: 'Noto Sans TC', sans-serif;
            --wood-grain: radial-gradient(circle, #f5dfc6 10%, #e6cbab 90%);
        }

        .theme-modern {
            /* 山水墨風變數 */
            --bg-color: #dce1e3; /* 宣紙水墨灰 */
            --container-bg: #f4f6f7;
            --panel-bg: #e1e6e8;
            --board-bg: #c9d2d6;
            --board-line: #2c3539; /* 徽墨深灰 */
            --text-color: #2c3539;
            --primary-btn: #4c5659;
            --primary-btn-hover: #5d6b71;
            --btn-text: #ffffff;
            --accent-color: #5c7178;
            --shadow-color: rgba(44, 53, 57, 0.15);
            --font-main: 'Noto Sans TC', sans-serif;
            --wood-grain: radial-gradient(circle, #ecf0f2 10%, #cbd4d8 90%);
        }

        /* 通用基本樣式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 遊戲大容器 */
        .game-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            max-width: 1000px;
            width: 100%;
            border: 2px solid transparent;
        }

        .theme-modern .game-container {
            border-color: rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
        }

        /* ==========================================================================
           棋盤區樣式
           ========================================================================== */
        .board-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 48 / 53;
            height: auto;
            background: var(--wood-grain);
            border-radius: 12px;
            padding: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.1);
            user-select: none;
            container-type: inline-size;
        }

        .theme-modern .board-wrapper {
            box-shadow: inset 0 0 20px rgba(44, 53, 57, 0.15), 0 0 15px rgba(44, 53, 57, 0.15);
        }

        /* SVG 棋盤線條 */
        .chess-board-svg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .board-line {
            stroke: var(--board-line);
            stroke-width: 2px;
            fill: none;
        }

        .board-line-thick {
            stroke: var(--board-line);
            stroke-width: 4px;
            fill: none;
        }

        .theme-modern .board-line,
        .theme-modern .board-line-thick {
            filter: drop-shadow(0 0 2px var(--board-line));
        }

        /* 棋子容器 */
        .pieces-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* 棋子樣式 */
        .piece {
            position: absolute;
            width: 9cqw;
            height: 9cqw;
            max-width: 44px;
            max-height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(14px, 4.5cqw, 22px);
            font-weight: bold;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: top 0.25s ease-out, left 0.25s ease-out, box-shadow 0.2s;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.35);
        }

        /* 古典風格棋子 */
        .piece.red {
            background: radial-gradient(circle at 35% 35%, #fff1e0 5%, #e1c095 80%);
            border: 3px solid #b32d2e;
            color: #b32d2e;
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.8);
            font-family: 'BiauKai', 'Kaiti', serif;
        }

        .piece.black {
            background: radial-gradient(circle at 35% 35%, #f4eae1 5%, #cab095 80%);
            border: 3px solid #222222;
            color: #222222;
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.8);
            font-family: 'BiauKai', 'Kaiti', serif;
        }

        /* 水墨風格棋子 */
        .theme-modern .piece.red {
            background: radial-gradient(circle at 30% 30%, #ffffff 5%, #e6d3d4 80%);
            border: 3px solid #8d2e2e;
            color: #8d2e2e;
            box-shadow: 1px 2px 5px rgba(141, 46, 46, 0.25);
            text-shadow: none;
            font-family: 'BiauKai', 'Kaiti', serif;
        }

        .theme-modern .piece.black {
            background: radial-gradient(circle at 30% 30%, #ffffff 5%, #ccd2d4 80%);
            border: 3px solid #2c3539;
            color: #2c3539;
            box-shadow: 1px 2px 5px rgba(44, 53, 57, 0.25);
            text-shadow: none;
            font-family: 'BiauKai', 'Kaiti', serif;
        }

        /* 棋子互動狀態 */
        .piece.selected {
            box-shadow: 0 0 15px #f5a623;
            transform: translate(-50%, -55%) scale(1.15);
            z-index: 10;
        }

        .theme-modern .piece.selected {
            box-shadow: 0 0 15px var(--accent-color);
            border-color: var(--accent-color);
        }

        /* 可移動路徑指示點 */
        .move-marker {
            position: absolute;
            width: 3cqw;
            height: 3cqw;
            max-width: 14px;
            max-height: 14px;
            border-radius: 50%;
            background-color: rgba(245, 166, 35, 0.7);
            border: 2px solid #fff;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 5;
            transition: transform 0.2s;
        }

        .move-marker:hover {
            transform: translate(-50%, -50%) scale(1.4);
        }

        .theme-modern .move-marker {
            background-color: rgba(92, 113, 120, 0.6);
            border-color: #f4f6f7;
            box-shadow: 0 0 8px rgba(92, 113, 120, 0.4);
        }

        /* 楚河漢界文字 */
        .river-text-group {
            font-size: 20px;
            font-weight: bold;
            fill: var(--board-line);
            opacity: 0.6;
        }

        /* ==========================================================================
           側邊指導欄
           ========================================================================== */
        .guide-section {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* AI 導師泡泡 */
        .coach-card {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        /* 導師頭像與名稱 */
        .coach-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .coach-avatar {
            width: 55px;
            height: 55px;
            background-color: var(--container-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .coach-info {
            display: flex;
            flex-direction: column;
        }

        .coach-name {
            font-size: 18px;
            font-weight: bold;
        }

        .coach-status {
            font-size: 12px;
            color: #7a6e60;
        }

        .theme-modern .coach-status {
            color: #94a3b8;
        }

        /* 對話框氣泡 */
        .coach-bubble {
            background-color: var(--container-bg);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.6;
            min-height: 80px;
            border-left: 4px solid var(--accent-color);
        }

        /* 控制面板 */
        .control-panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .theme-toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 功能按鈕 */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-btn);
            color: var(--btn-text);
        }

        .btn-primary:hover {
            background-color: var(--primary-btn-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary-btn);
            color: var(--primary-btn);
        }

        .btn-outline:hover {
            background-color: var(--primary-btn);
            color: var(--btn-text);
        }

        /* 開關切換樣式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* 遊戲狀態 */
        .game-status-bar {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .status-value {
            font-weight: bold;
            font-size: 16px;
        }

        /* 驚喜動畫：提示發光 */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--accent-color); }
            50% { box-shadow: 0 0 20px var(--accent-color); }
            100% { box-shadow: 0 0 5px var(--accent-color); }
        }

        .hint-pulse {
            animation: pulse-glow 1.5s infinite;
        }

        /* ==========================================================================
           視覺與輔助功能新增樣式
           ========================================================================== */
        
        /* 粒子效果 */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 15;
            border-radius: 2px;
        }

        /* 將軍警告條 */
        .check-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(135deg, rgba(183, 45, 46, 0.95), rgba(138, 51, 36, 0.95));
            color: white;
            font-size: 48px;
            font-weight: bold;
            padding: 20px 60px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(183, 45, 46, 0.6);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 15px;
            text-indent: 15px;
            font-family: var(--font-main);
        }
        .check-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .theme-modern .check-banner {
            background: linear-gradient(135deg, rgba(44, 53, 57, 0.95), rgba(92, 113, 120, 0.95));
            border: 2px solid #00f5ff;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.4);
            color: #00f5ff;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
        }

        /* 被威脅的老帥 (將軍中) */
        .threatened-king {
            animation: threatenedPulse 1s infinite, threatenedShake 0.5s infinite;
            box-shadow: 0 0 20px #ff3333 !important;
            border-color: #ff3333 !important;
        }
        @keyframes threatenedPulse {
            0% { box-shadow: 0 0 10px #ff3333; }
            50% { box-shadow: 0 0 25px #ff9999; }
            100% { box-shadow: 0 0 10px #ff3333; }
        }
        @keyframes threatenedShake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            20% { transform: translate(-52%, -48%) rotate(-1.5deg); }
            40% { transform: translate(-48%, -52%) rotate(1.5deg); }
            60% { transform: translate(-52%, -52%) rotate(1deg); }
            80% { transform: translate(-48%, -48%) rotate(-1deg); }
        }

        /* 最後落子標記 */
        .last-move-marker {
            position: absolute;
            width: 9cqw;
            height: 9cqw;
            max-width: 44px;
            max-height: 44px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            box-sizing: border-box;
        }
        .last-move-marker.start {
            border: 2px dashed rgba(183, 45, 46, 0.5);
            background-color: rgba(183, 45, 46, 0.05);
        }
        .theme-modern .last-move-marker.start {
            border: 2px dashed rgba(0, 245, 255, 0.4);
            background-color: rgba(0, 245, 255, 0.03);
        }
        .last-move-marker.end {
            border: 2px solid #b32d2e;
            box-shadow: 0 0 10px rgba(179, 45, 46, 0.6);
            animation: lastMovePulse 1.5s infinite;
        }
        .theme-modern .last-move-marker.end {
            border: 2px solid #00f5ff;
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.6);
        }
        @keyframes lastMovePulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            100% { opacity: 0.7; }
        }

        /* Q版卡通造型棋子 */
        .piece.cartoon-style {
            flex-direction: column;
            justify-content: center;
            gap: 0px;
            padding-top: 2px;
        }
        .cartoon-emoji {
            font-size: clamp(14px, 4.5cqw, 22px);
            line-height: 1.1;
        }
        .cartoon-label {
            font-size: clamp(8px, 2.5cqw, 11px);
            font-weight: bold;
            opacity: 0.85;
            margin-top: -1px;
        }

        /* 絆馬腳/塞象眼紅 X 提示 */
        .blocker-marker {
            position: absolute;
            width: 6cqw;
            height: 6cqw;
            max-width: 30px;
            max-height: 30px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            font-weight: bold;
            font-size: 20px;
            z-index: 6;
            text-shadow: 0 0 4px white;
            pointer-events: none;
            animation: blink 1.2s infinite;
        }
        .theme-modern .blocker-marker {
            color: #ff5555;
            text-shadow: 0 0 4px black;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1.0; }
        }

        

        /* ==========================================================================
           響應式 RWD 調整
           ========================================================================== */
        @media (max-width: 1100px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .board-section {
                width: 100%;
            }
            .guide-section, .history-section {
                width: 100%;
                max-width: 480px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="mainContainer">
    
    <!-- 棋盤展示區 -->
    <div class="board-section">
        <div class="board-wrapper" id="boardWrapper">
            <!-- 中國象棋精準 SVG 棋盤線條 -->
            <svg class="chess-board-svg" viewBox="0 0 450 500">
                <defs>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d4d" />
                    </marker>
                    <marker id="arrow-green" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2ecc71" />
                    </marker>
                </defs>
                
                <!-- 攻防射線群組 -->
                <g id="radarGroup"></g>
                
                <!-- 棋盤座標標示 -->
                <g class="board-coordinates" font-size="11" font-weight="bold" font-family="var(--font-main)" fill="var(--board-line)" opacity="0.6" text-anchor="middle">
                    <!-- 上方黑方座標 -->
                    <text x="25" y="15">1</text>
                    <text x="75" y="15">2</text>
                    <text x="125" y="15">3</text>
                    <text x="175" y="15">4</text>
                    <text x="225" y="15">5</text>
                    <text x="275" y="15">6</text>
                    <text x="325" y="15">7</text>
                    <text x="375" y="15">8</text>
                    <text x="425" y="15">9</text>
                    <!-- 下方紅方座標 -->
                    <text x="25" y="493">九</text>
                    <text x="75" y="493">八</text>
                    <text x="125" y="493">七</text>
                    <text x="175" y="493">六</text>
                    <text x="225" y="493">五</text>
                    <text x="275" y="493">四</text>
                    <text x="325" y="493">三</text>
                    <text x="375" y="493">二</text>
                    <text x="425" y="493">一</text>
                    <!-- 左側縱向座標 -->
                    <text x="10" y="29">A</text>
                    <text x="10" y="79">B</text>
                    <text x="10" y="129">C</text>
                    <text x="10" y="179">D</text>
                    <text x="10" y="229">E</text>
                    <text x="10" y="279">F</text>
                    <text x="10" y="329">G</text>
                    <text x="10" y="379">H</text>
                    <text x="10" y="429">I</text>
                    <text x="10" y="479">J</text>
                    <!-- 右側縱向座標 -->
                    <text x="440" y="29">A</text>
                    <text x="440" y="79">B</text>
                    <text x="440" y="129">C</text>
                    <text x="440" y="179">D</text>
                    <text x="440" y="229">E</text>
                    <text x="440" y="279">F</text>
                    <text x="440" y="329">G</text>
                    <text x="440" y="379">H</text>
                    <text x="440" y="429">I</text>
                    <text x="440" y="479">J</text>
                </g>

                <!-- 外邊框 -->
                <rect x="25" y="25" width="400" height="450" class="board-line-thick"></rect>
                
                <!-- 橫線 -->
                <line x1="25" y1="75" x2="425" y2="75" class="board-line"></line>
                <line x1="25" y1="125" x2="425" y2="125" class="board-line"></line>
                <line x1="25" y1="175" x2="425" y2="175" class="board-line"></line>
                <line x1="25" y1="225" x2="425" y2="225" class="board-line"></line>
                <!-- 楚河漢界這行不做橫線(已被外框包住一半) -->
                <line x1="25" y1="275" x2="425" y2="275" class="board-line"></line>
                <line x1="25" y1="325" x2="425" y2="325" class="board-line"></line>
                <line x1="25" y1="375" x2="425" y2="375" class="board-line"></line>
                <line x1="25" y1="425" x2="425" y2="425" class="board-line"></line>
                
                <!-- 直線（黑方、紅方各自在河界處截斷） -->
                <!-- 外側兩條直線貫穿 -->
                <line x1="25" y1="25" x2="25" y2="475" class="board-line"></line>
                <line x1="425" y1="25" x2="425" y2="475" class="board-line"></line>
                <!-- 內部直角線 -->
                <!-- 黑方直線 -->
                <line x1="75" y1="25" x2="75" y2="225" class="board-line"></line>
                <line x1="125" y1="25" x2="125" y2="225" class="board-line"></line>
                <line x1="175" y1="25" x2="175" y2="225" class="board-line"></line>
                <line x1="225" y1="25" x2="225" y2="225" class="board-line"></line>
                <line x1="275" y1="25" x2="275" y2="225" class="board-line"></line>

    const AudioSystem = {
        ctx: null,
        init() {
            try {

            }
        },

            try {

            try {
                this.init();
                if (!this.ctx) return;
                this.synthesizeCyberSound(880, 0.15);

            } catch (e) {
                console.error("Failed to play warning sound:", e);
            }
        },
        synthesizeWoodSound(isCapture = false) {
            try {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gainNode = this.ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(this.ctx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);

                gainNode.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (isCapture ? 0.3 : 0.12));

                osc.start();
                osc.stop(this.ctx.currentTime + (isCapture ? 0.3 : 0.12));
            } catch (e) {
                console.error("synthesizeWoodSound failed:", e);
            }
        },
        synthesizeCyberSound(freq, duration, noise = false) {
            try {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gainNode = this.ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(this.ctx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq/2, this.ctx.currentTime + duration);

                gainNode.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) {
                console.error("synthesizeCyberSound failed:", e);
            }
        }
    };

    // 4. 吃子爆裂粒子特效
    function spawnCaptureParticles(r, c) {
        const wrapper = document.getElementById('boardWrapper');
        if (!wrapper) return;
        const xPct = 5.55 + c * 11.11;
        const yPct = 5 + r * 10;
        
        const isModern = document.getElementById('mainContainer').classList.contains('theme-modern');
        const particleCount = 15;
        
        for (let i = 0; i < particleCount; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = `${xPct}%`;
            p.style.top = `${yPct}%`;
            
            if (isModern) {
                // 水墨主題：黑灰等墨汁點
                const colors = ['#2c3539', '#4c5659', '#1a1a1a', '#8fa1a6'];
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.borderRadius = '50%';
                const sz = Math.random() * 8 + 4;
                p.style.width = `${sz}px`;
                p.style.height = `${sz}px`;
            } else {
                // 古典主題：木屑色
                const colors = ['#8a3324', '#d4a373', '#5c3e21', '#e6cbab'];
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                const w = Math.random() * 6 + 3;
                const h = Math.random() * 4 + 2;
                p.style.width = `${w}px`;
                p.style.height = `${h}px`;
                p.style.transform = `rotate(${Math.random() * 360}deg)`;
            }
            
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 1.5;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            
            wrapper.appendChild(p);
            
            let posX = 0;
            let posY = 0;
            let gravity = 0.2;
            let curVx = vx;
            let curVy = vy;
            let opacity = 1.0;
            
            const interval = setInterval(() => {
                posX += curVx;
                posY += curVy;
                curVy += gravity;
                opacity -= 0.05;
                
                p.style.transform = `translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px))`;
                p.style.opacity = opacity;
                
                if (opacity <= 0) {
                    clearInterval(interval);
                    p.remove();
                }
            }, 20);
        }
    }

    // 5. 棋步覆盤功能
    function renderHistory() {
        const moveList = document.getElementById('moveList');
        if (!moveList) return;
        moveList.innerHTML = '';
        
        if (moveHistory.length === 0) {
            moveList.innerHTML = `<div style="text-align: center; color: gray; padding: 20px; font-size: 13px;">暫無對局紀錄</div>`;
            return;
        }
        
        let html = '';
        for (let i = 0; i < moveHistory.length; i += 2) {
            const roundNum = Math.floor(i / 2) + 1;
            const playerMove = moveHistory[i];
            const aiMove = moveHistory[i + 1] || null;
            
            const activePlayerClass = (isReviewMode && liveGameState && liveGameState.reviewIndex === i) ? 'active' : '';
            const activeAIClass = (isReviewMode && liveGameState && liveGameState.reviewIndex === i + 1) ? 'active' : '';
            
            html += `
                <div class="history-row">
                    <span style="color: gray; font-weight: bold; width: 50px;">第 ${roundNum} 回</span>
                    <span class="hist-move ${activePlayerClass}" data-index="${i}">${playerMove.text}</span>
                    <span class="hist-move ${activeAIClass}" data-index="${i+1}">${aiMove ? aiMove.text : ''}</span>
                </div>
            `;
        }
        moveList.innerHTML = html;
        moveList.scrollTop = moveList.scrollHeight;
        
        const spans = moveList.getElementsByClassName('hist-move');
        for (let span of spans) {
            const idx = parseInt(span.getAttribute('data-index'));
            if (isNaN(idx) || span.textContent.trim() === '') continue;
            
            span.addEventListener('click', (e) => {
                e.stopPropagation();
                enterReviewMode(idx);
            });
        }
    }

    function enterReviewMode(index) {
        if (isAILocked) return;
        
        const step = moveHistory[index];
        if (!step) return;
        
        if (!isReviewMode) {
            liveGameState = {
                board: JSON.parse(JSON.stringify(board)),
                turn: turn,
                selectedPiece: selectedPiece ? JSON.parse(JSON.stringify(selectedPiece)) : null,
                lastMove: lastMove ? JSON.parse(JSON.stringify(lastMove)) : null,
                history: JSON.parse(JSON.stringify(history)),
                reviewIndex: index
            };
            isReviewMode = true;
            document.getElementById('exitReviewBtn').style.display = 'block';
        }
        
        liveGameState.reviewIndex = index;
        
        // 還原狀態
        board = JSON.parse(step.boardState);
        turn = step.turn;
        selectedPiece = step.selectedPiece;
        lastMove = step.lastMove;
        
        setCoachExpression('think');
        triggerCoachSpeech("覆盤回溯中", `你正在查看第 ${Math.floor(index / 2) + 1} 回合${index % 2 === 0 ? '紅方' : '黑方'}落子後的局面。點擊【返回最新棋局】可以繼續下棋。`, "🤔");
        
        renderBoard();
        renderHistory();
    }

    function exitReviewMode() {
        if (!isReviewMode || !liveGameState) return;
        
        board = liveGameState.board;
        turn = liveGameState.turn;
        selectedPiece = liveGameState.selectedPiece;
        lastMove = liveGameState.lastMove;
        history = liveGameState.history;
        
        isReviewMode = false;
        liveGameState = null;
        document.getElementById('exitReviewBtn').style.display = 'none';
        
        setCoachExpression('smile');
        triggerCoachSpeech("返回對局", "回溯結束！現在是最新棋局，請繼續加油！", "😸");
        
        renderBoard();
        renderHistory();
    }

    // 7. 攻防雷達計算與線條繪製
    function getPieceThreatsAndGuards(r, c) {
        const piece = board[r][c];
        if (!piece || piece.endsWith('_h')) return { threats: [], guards: [] };
        const [side, type] = piece.split('_');
        const threats = [];
        const guards = [];
        
        const addTarget = (tr, tc) => {
            const tSide = getSide(tr, tc);
            if (tSide) {
                if (tSide === side) guards.push({r: tr, c: tc});
                else threats.push({r: tr, c: tc});
            }
        };
        
        switch (type) {
            case 'R': { // 車
                const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
                for (let d of dirs) {
                    let nr = r + d[0];
                    let nc = c + d[1];
                    while (inBoard(nr, nc)) {
                        if (board[nr][nc]) {
                            addTarget(nr, nc);
                            break;
                        }
                        nr += d[0];
                        nc += d[1];
                    }
                }
                break;
            }
            case 'C': { // 炮
                const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
                for (let d of dirs) {
                    let nr = r + d[0];
                    let nc = c + d[1];
                    let obstacle = false;
                    while (inBoard(nr, nc)) {
                        if (!obstacle) {
                            if (board[nr][nc]) obstacle = true;
                        } else {
                            if (board[nr][nc]) {
                                addTarget(nr, nc);
                                break;
                            }
                        }
                        nr += d[0];
                        nc += d[1];
                    }
                }
                break;
            }
            case 'H': { // 馬
                const knightMoves = [
                    {dr: -2, dc: -1, legR: -1, legC: 0},
                    {dr: -2, dc: 1, legR: -1, legC: 0},
                    {dr: 2, dc: -1, legR: 1, legC: 0},
                    {dr: 2, dc: 1, legR: 1, legC: 0},
                    {dr: -1, dc: -2, legR: 0, legC: -1},
                    {dr: 1, dc: -2, legR: 0, legC: -1},
                    {dr: -1, dc: 2, legR: 0, legC: 1},
                    {dr: 1, dc: 2, legR: 0, legC: 1}
                ];
                for (let km of knightMoves) {
                    const nr = r + km.dr;
                    const nc = c + km.dc;
                    if (inBoard(nr, nc)) {
                        if (!board[r + km.legR][c + km.legC]) {
                            addTarget(nr, nc);
                        }
                    }
                }
                break;
            }
            case 'E': { // 象
                const eleMoves = [[-2,-2], [-2,2], [2,-2], [2,2]];
                for (let em of eleMoves) {
                    const nr = r + em[0];
                    const nc = c + em[1];
                    if (inBoard(nr, nc)) {
                        if (side === 'R' && nr < 5) continue;
                        if (side === 'B' && nr > 4) continue;
                        if (!board[r + em[0]/2][c + em[1]/2]) {
                            addTarget(nr, nc);
                        }
                    }
                }
                break;
            }
            case 'A': { // 士
                const advMoves = [[-1,-1], [-1,1], [1,-1], [1,1]];
                for (let am of advMoves) {
                    const nr = r + am[0];
                    const nc = c + am[1];
                    if (inBoard(nr, nc)) {
                        if (nc < 3 || nc > 5) continue;
                        if (side === 'R' && (nr < 7 || nr > 9)) continue;
                        if (side === 'B' && (nr < 0 || nr > 2)) continue;
                        addTarget(nr, nc);
                    }
                }
                break;
            }
            case 'G': { // 將
                const genMoves = [[-1,0], [1,0], [0,-1], [0,1]];
                for (let gm of genMoves) {
                    const nr = r + gm[0];
                    const nc = c + gm[1];
                    if (inBoard(nr, nc)) {
                        if (nc < 3 || nc > 5) continue;
                        if (side === 'R' && (nr < 7 || nr > 9)) continue;
                        if (side === 'B' && (nr < 0 || nr > 2)) continue;
                        addTarget(nr, nc);
                    }
                }
                break;
            }
            case 'P': { // 兵
                if (side === 'R') {
                    if (inBoard(r - 1, c)) addTarget(r - 1, c);
                    if (r <= 4) {
                        if (inBoard(r, c - 1)) addTarget(r, c - 1);
                        if (inBoard(r, c + 1)) addTarget(r, c + 1);
                    }
                } else {
                    if (inBoard(r + 1, c)) addTarget(r + 1, c);
                    if (r >= 5) {
                        if (inBoard(r, c - 1)) addTarget(r, c - 1);
                        if (inBoard(r, c + 1)) addTarget(r, c + 1);
                    }
                }
                break;
            }
        }
        return { threats, guards };
    }

    // 8. 平滑移動與吃子特效執行器
    function animateAndExecuteMove(fromR, fromC, toR, toC, callback) {
        const layer = document.getElementById('piecesLayer');
        const pieceDivs = layer.getElementsByClassName('piece');
        let targetDiv = null;
        
        // 尋找要移動的棋子元件
        for (let div of pieceDivs) {
            if (parseInt(div.dataset.row) === fromR && parseInt(div.dataset.col) === fromC) {
                targetDiv = div;
                break;
            }
        }
        
        const isCap = board[toR][toC] !== null;
        if (isCap) {
            // 尋找被吃掉的棋子元件，並將其縮小淡出
            for (let div of pieceDivs) {
                if (parseInt(div.dataset.row) === toR && parseInt(div.dataset.col) === toC) {
                    div.style.transform = 'translate(-50%, -50%) scale(0)';
                    div.style.opacity = '0';
                    break;
                }
            }
            triggerBoardShake();
            spawnCaptureParticles(toR, toC);
        }
