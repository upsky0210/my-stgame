<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階五子棋 - 智能指導版</title>
    <!-- 引入中文與英文字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           全域變數與主題設定
           ========================================================================== */
        :root {
            /* 木質風變數 */
            --bg-color: #f4eae1;
            --container-bg: #fffdfa;
            --panel-bg: #efe3d5;
            --board-bg: #deb887;
            --board-line: #5d4037;
            --text-color: #4a2c11;
            --primary-btn: #8a3324;
            --primary-btn-hover: #a13d2d;
            --btn-text: #ffffff;
            --accent-color: #d4a373;
            --shadow-color: rgba(92, 62, 33, 0.2);
            --font-main: 'Noto Sans TC', sans-serif;
        }

        .theme-modern {
            /* 山水墨風變數 */
            --bg-color: #dce1e3; /* 宣紙水墨灰 */
            --container-bg: #f4f6f7;
            --panel-bg: #e1e6e8;
            --board-bg: #f0efea;
            --board-line: #2c3539; /* 徽墨深灰 */
            --text-color: #2c3539;
            --primary-btn: #4c5659;
            --primary-btn-hover: #5d6b71;
            --btn-text: #ffffff;
            --accent-color: #5c7178;
            --shadow-color: rgba(44, 53, 57, 0.15);
            --font-main: 'Noto Sans TC', sans-serif;
        }

        /* 通用基本樣式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 遊戲大容器 */
        .game-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            max-width: 950px;
            width: 100%;
            border: 2px solid transparent;
        }

        .theme-modern .game-container {
            border-color: rgba(92, 113, 120, 0.2);
            box-shadow: 0 5px 25px var(--shadow-color);
        }

        /* ==========================================================================
           棋盤區樣式
           ========================================================================== */
        .board-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            height: auto;
            border-radius: 12px;
            padding: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.1);
            user-select: none;
            container-type: inline-size;
        }

        .theme-modern .board-wrapper {
            box-shadow: inset 0 0 20px rgba(44, 53, 57, 0.15), 0 0 15px rgba(44, 53, 57, 0.15);
        }

        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            display: block;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ==========================================================================
           側邊指導欄
           ========================================================================== */
        .guide-section {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* AI 導師泡泡 */
        .coach-card {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        /* 導師頭像與名稱 */
        .coach-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .coach-avatar {
            width: 55px;
            height: 55px;
            background-color: var(--container-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--accent-color);
            box-shadow: 0 2px 10px var(--shadow-color);
            overflow: hidden;
        }

        .coach-info {
            display: flex;
            flex-direction: column;
        }

        .coach-name {
            font-size: 18px;
            font-weight: bold;
        }

        .coach-status {
            font-size: 12px;
            color: #7a6e60;
        }

        .theme-modern .coach-status {
            color: #5c7178;
        }

        /* 對話框氣泡 */
        .coach-bubble {
            background-color: var(--container-bg);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.6;
            min-height: 80px;
            border-left: 4px solid var(--accent-color);
        }

        /* 控制面板 */
        .control-panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .theme-toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 功能按鈕 */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-btn);
            color: var(--btn-text);
        }

        .btn-primary:hover {
            background-color: var(--primary-btn-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary-btn);
            color: var(--primary-btn);
        }

        .btn-outline:hover {
            background-color: var(--primary-btn);
            color: var(--btn-text);
        }

        /* 開關切換樣式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* 遊戲狀態 */
        .game-status-bar {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .status-value {
            font-weight: bold;
            font-size: 16px;
        }

        /* 驚喜動畫：提示發光 */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--accent-color); }
            50% { box-shadow: 0 0 20px var(--accent-color); }
            100% { box-shadow: 0 0 5px var(--accent-color); }
        }

        .hint-pulse {
            animation: pulse-glow 1.5s infinite;
        }

        /* 歷史紀錄與新面板 */
        .history-panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 15px var(--shadow-color);
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .history-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .history-item {
            background: var(--container-bg);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
        }
        .history-item:hover {
            background: var(--primary-btn-hover);
            color: white;
        }

        /* ==========================================================================
           響應式 RWD 調整
           ========================================================================== */
        @media (max-width: 850px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .board-section {
                width: 100%;
            }
            .guide-section {
                width: 100%;
                max-width: 480px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="mainContainer">
    
    <!-- 棋盤展示區 -->
    <div class="board-section">
        <div class="board-wrapper" id="boardWrapper">
            <!-- 高畫質、自適應 Canvas 棋盤 -->
            <canvas id="chess" width="480" height="480"></canvas>
        </div>
    </div>

    <!-- 側邊指導欄區 -->
    <div class="guide-section">
        
        <!-- AI 導師泡泡 -->
        <div class="coach-card" id="coachCard">
            <div class="coach-header">
                <!-- 萌化 綸巾貓咪 向量頭像 -->
                <div class="coach-avatar" id="coachAvatar">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <!-- Background circle -->
                        <circle cx="50" cy="50" r="48" fill="#fcf8f2" stroke="#dcd3c1" stroke-width="2"/>
                        <!-- Scholar Robe Collar -->
                        <path d="M 30,85 L 50,70 L 70,85 L 60,95 L 40,95 Z" fill="#4a5a80" />
                        <path d="M 35,85 L 50,72 L 65,85 L 50,95 Z" fill="#ffffff" />
                        <!-- Cat Head -->
                        <!-- Ears -->
                        <path d="M 22,50 L 15,20 L 38,35 Z" fill="#f3eae1" stroke="#cab095" stroke-width="1.5"/>
                        <path d="M 24,46 L 19,25 L 34,35 Z" fill="#ffccd5" />
                        <path d="M 78,50 L 85,20 L 62,35 Z" fill="#f3eae1" stroke="#cab095" stroke-width="1.5"/>
                        <path d="M 76,46 L 81,25 L 66,35 Z" fill="#ffccd5" />
                        <!-- Face base -->
                        <ellipse cx="50" cy="55" rx="30" ry="25" fill="#fcfaf2" stroke="#cab095" stroke-width="1.5"/>
                        <!-- Scholar Hat (綸巾) -->
                        <path d="M 32,32 Q 50,28 68,32 L 65,15 Q 50,18 35,15 Z" fill="#303841" />
                        <!-- Hat ribbon draping -->
                        <path d="M 32,32 L 25,60 L 29,61 L 34,32 Z" fill="#303841" />
                        <path d="M 68,32 L 75,60 L 71,61 L 66,32 Z" fill="#303841" />
                        <!-- Jade Jewel on Hat -->
                        <circle cx="50" cy="24" r="3.5" fill="#50b498" />
                        <circle cx="50" cy="24" r="1.5" fill="#ffffff" opacity="0.8" />
                        <!-- Cat Whiskers -->
                        <line x1="15" y1="58" x2="32" y2="58" stroke="#cab095" stroke-width="1.5" />
                        <line x1="14" y1="63" x2="30" y2="62" stroke="#cab095" stroke-width="1.5" />
                        <line x1="85" y1="58" x2="68" y2="58" stroke="#cab095" stroke-width="1.5" />
                        <line x1="86" y1="63" x2="70" y2="62" stroke="#cab095" stroke-width="1.5" />
                        <!-- Eyes -->
                        <circle cx="38" cy="52" r="4.5" fill="#2b2d2f" class="coach-eye" />
                        <circle cx="36.5" cy="50" r="1.5" fill="#ffffff" />
                        <circle cx="62" cy="52" r="4.5" fill="#2b2d2f" class="coach-eye" />
                        <circle cx="60.5" cy="50" r="1.5" fill="#ffffff" />
                        <!-- Blush cheeks -->
                        <ellipse cx="28" cy="58" rx="3" ry="1.5" fill="#ffb3ba" opacity="0.6" class="coach-blush"/>
                        <ellipse cx="72" cy="58" rx="3" ry="1.5" fill="#ffb3ba" opacity="0.6" class="coach-blush"/>
                        <!-- Nose -->
                        <polygon points="48,56 52,56 50,59" fill="#ffccd5" stroke="#f0a0a0" stroke-width="0.5" />
                        <!-- Mouth -->
                        <path id="coachMouth" d="M 46,62 Q 50,65 50,62 Q 50,65 54,62" fill="none" stroke="#2b2d2f" stroke-width="1.5" stroke-linecap="round" />
                        <!-- Sweat Drop -->
                        <path id="coachSweat" d="M 75,35 Q 75,45 80,45 Q 85,45 85,35 Q 80,30 75,35 Z" fill="#a0d8ef" opacity="0" />
                    </svg>
                </div>
                <div class="coach-info">
                    <span class="coach-name" id="coachName">孔明貓教練</span>
                    <span class="coach-status" id="coachStatus">正在觀察局勢...</span>
                </div>
            </div>
            <div class="coach-bubble" id="coachBubble">
                哈囉！小棋士喵！今天我們來下一局「指導五子棋」吧！
                當你覺得卡關或想學新戰術時，隨時點擊【請教教練】按鈕，我會幫你剖析局勢喔！
            </div>
        </div>

        <!-- 遊戲數據狀態 -->
        <div class="game-status-bar">
            <div class="status-item">
                <div class="status-label">當前回合</div>
                <div class="status-value" id="turnValue" style="color: #222222;">您的回合 (黑)</div>
            </div>
            <div class="status-item">
                <div class="status-label">對戰強度</div>
                <div class="status-value" id="levelValue">入門難度</div>
            </div>
        </div>

        <!-- 控制與設定面板 -->
        <div class="control-panel">
            <div class="theme-toggle-container">
                <span style="font-weight: bold;">切換風格 (木質/水墨)</span>
                <label class="switch">
                    <input type="checkbox" id="themeSwitch">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="theme-toggle-container">
                <span style="font-weight: bold;">AI 思考強度</span>
                <select id="difficultySelect" style="padding: 5px 10px; border-radius: 5px; font-family: inherit;">
                    <option value="beginner" selected>入門級 (適合新手)</option>
                    <option value="master">大師級 (深謀遠慮)</option>
                </select>
            </div>

            <div class="theme-toggle-container">
                <span style="font-weight: bold;">棋子造型</span>
                <select id="skinSelect" style="padding: 5px 10px; border-radius: 5px; font-family: inherit;">
                    <option value="default" selected>經典黑白</option>
                    <option value="animal">貓狗大戰</option>
                    <option value="gem">寶石對決</option>
                </select>
            </div>

            <div class="theme-toggle-container">
                <span style="font-weight: bold;">局勢熱力圖 (教學透視)</span>
                <label class="switch">
                    <input type="checkbox" id="heatmapSwitch">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="history-panel">
                <div class="history-title">📜 對弈紀錄表</div>
                <div class="history-list" id="historyList">
                    <!-- 動態加入 -->
                </div>
            </div>

            <!-- 控制按鈕 -->
            <div class="btn-group">
                <button class="btn btn-outline" id="undoBtn">悔棋 ↩</button>
                <button class="btn btn-outline" id="restartBtn">重新開始 🔄</button>
            </div>
            
            <button class="btn btn-primary" id="hintBtn" style="grid-column: span 2; font-size: 16px;">
                💡 請教教練 (取得思路提示)
            </button>
        </div>

    </div>

</div>

<!-- ==========================================================================
     JavaScript 核心邏輯
     ========================================================================== -->
<script>
    // 棋盤基礎常數 (以480x480為標準)
    const canvas = document.getElementById('chess');
    const ctx = canvas.getContext('2d');
    const statusTxt = document.getElementById('status');
    const turnVal = document.getElementById('turnValue');
    
    const size = 15;
    const padding = 30; // 邊界間距
    const step = 30;    // 30 * 14 = 420. total 480

    let board = [];
    let history = []; // 用於悔棋的歷史紀錄
    let over = false;
    let me = true; // 玩家為黑(1)，AI為白(2)

    // 新增全域變數
    let winPath = [];
    let lastMove = null;
    let hoverMove = null;
    let recordedMoves = [];
    let showHeatmap = false;
    let currentSkin = 'default';
    let animatingPiece = null;
    let particles = [];

    // 音效合成系統 (Web Audio API)
    const AudioSystem = {
        ctx: null,
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        },
        playClack(isInk = false) {
            this.init();
            if (isInk) {
                // 石質、瓷器般清脆深邃的敲擊
                const osc = this.ctx.createOscillator();
                const gainNode = this.ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            } else {
                // 傳統清脆木頭敲擊
                const osc = this.ctx.createOscillator();
                const gainNode = this.ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(this.ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.12);
                gainNode.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
        },
        playWarning() {
            this.init();
            const osc = this.ctx.createOscillator();
            const gainNode = this.ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(this.ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.setValueAtTime(900, this.ctx.currentTime + 0.08);
            gainNode.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.25);
        }
    };

    // ==========================================================================
    // 核心渲染邏輯
    // ==========================================================================

    function resetGame() {
        board = Array.from({ length: size }, () => Array(size).fill(0));
        history = [];
        over = false;
        me = true;
        
        winPath = [];
        lastMove = null;
        hoverMove = null;
        recordedMoves = [];
        animatingPiece = null;
        particles = [];
        updateHistoryUI();
        
        const modeText = document.getElementById('difficultySelect').value === "beginner" ? "入門難度" : "大師難度";
        document.getElementById('levelValue').textContent = modeText;
        
        turnVal.textContent = "您的回合 (黑)";
        turnVal.style.color = "#000000";
        
        drawBoard();
        triggerCoachSpeech("開局大吉", "新局開始囉喵！這一次由你執黑先行。看看能不能找出五顆連線的致勝之道？加油！", "😸");
    }

    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const isInk = document.getElementById('mainContainer').classList.contains('theme-modern');
        ctx.fillStyle = isInk ? "#f0efea" : "#deb887";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 渲染底圖花紋 texture
        if (!isInk) {
            ctx.fillStyle = "rgba(139, 69, 19, 0.04)";
            for (let i = 0; i < canvas.width; i += 6) {
                if (Math.random() > 0.5) {
                    ctx.fillRect(i, 0, 2, canvas.height);
                }
            }
        } else {
            // 水墨紙張纖維感
            ctx.fillStyle = "rgba(0, 0, 0, 0.015)";
            for (let i = 0; i < 60; i++) {
                const rx = Math.random() * canvas.width;
                const ry = Math.random() * canvas.height;
                const rr = Math.random() * 25 + 5;
                ctx.beginPath();
                ctx.arc(rx, ry, rr, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        // 教學熱力圖
        if (showHeatmap) {
            ctx.globalAlpha = 0.2;
            for(let r=0; r<size; r++) {
                for(let c=0; c<size; c++) {
                    if (board[r][c] === 0) {
                        let pVal = evaluate(r, c, 1);
                        let aVal = evaluate(r, c, 2);
                        if (pVal > aVal && pVal > 15) {
                            ctx.fillStyle = "rgba(39, 174, 96, 1)";
                            ctx.fillRect(padding + r*step - step/2, padding + c*step - step/2, step, step);
                        } else if (aVal > pVal && aVal > 15) {
                            ctx.fillStyle = "rgba(231, 76, 60, 1)";
                            ctx.fillRect(padding + r*step - step/2, padding + c*step - step/2, step, step);
                        }
                    }
                }
            }
            ctx.globalAlpha = 1.0;
        }
        
        // 繪製棋盤線條
        ctx.strokeStyle = isInk ? "rgba(44, 53, 57, 0.75)" : "#5d4037";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < size; i++) {
            // 直線
            ctx.beginPath();
            ctx.moveTo(padding + i * step, padding);
            ctx.lineTo(padding + i * step, padding + (size - 1) * step);
            ctx.stroke();
            
            // 橫線
            ctx.beginPath();
            ctx.moveTo(padding, padding + i * step);
            ctx.lineTo(padding + (size - 1) * step, padding + i * step);
            ctx.stroke();
        }

        // 繪製座標 (A~O, 1~15)
        ctx.fillStyle = isInk ? "rgba(44, 53, 57, 0.6)" : "rgba(93, 64, 55, 0.6)";
        ctx.font = "bold 10px Orbitron, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for(let i=0; i<size; i++) {
            const letter = String.fromCharCode(65 + i);
            ctx.fillText(letter, padding + i * step, padding / 2.5);
            ctx.fillText(letter, padding + i * step, canvas.height - padding / 2.5);
            
            const num = (15 - i).toString();
            ctx.fillText(num, padding / 2.5, padding + i * step);
            ctx.fillText(num, canvas.width - padding / 2.5, padding + i * step);
        }
        
        // 繪製標準五子棋「星位」 (天元 + 四角)
        const stars = [
            {x: 3, y: 3}, {x: 3, y: 11}, {x: 7, y: 7}, {x: 11, y: 3}, {x: 11, y: 11}
        ];
        ctx.fillStyle = isInk ? "rgba(44, 53, 57, 0.9)" : "#5d4037";
        for (let star of stars) {
            ctx.beginPath();
            ctx.arc(padding + star.x * step, padding + star.y * step, 4, 0, 2 * Math.PI);
            ctx.fill();
        }
        
        // 重繪當前所有的棋子
        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                if (board[r][c] !== 0) {
                    if (animatingPiece && animatingPiece.r === r && animatingPiece.c === c) continue;
                    
                    let isWinPiece = false;
                    if (winPath.length > 0) {
                        isWinPiece = winPath.some(p => p.r === r && p.c === c);
                        ctx.globalAlpha = isWinPiece ? 1.0 : 0.3;
                    }
                    drawPiece(r, c, board[r][c] === 1, 1);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // 滑鼠懸停預覽
        if (hoverMove && !over && board[hoverMove.r][hoverMove.c] === 0) {
            ctx.globalAlpha = 0.4;
            drawPiece(hoverMove.r, hoverMove.c, me, 1);
            ctx.globalAlpha = 1.0;
        }

        // 動畫中的棋子
        if (animatingPiece) {
            const progress = Math.min((Date.now() - animatingPiece.start) / 250, 1);
            const easeOutBack = x => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
            const scale = animatingPiece.scale - ((animatingPiece.scale - 1) * easeOutBack(progress));
            ctx.globalAlpha = progress;
            drawPiece(animatingPiece.r, animatingPiece.c, animatingPiece.isBlack, Math.max(1, scale));
            ctx.globalAlpha = 1.0;
            
            if (progress >= 1) animatingPiece = null;
        }

        // 勝利連線高光
        if (winPath.length >= 5) {
            winPath.sort((a,b) => a.r === b.r ? a.c - b.c : a.r - b.r);
            const startP = winPath[0];
            const endP = winPath[winPath.length-1];
            ctx.beginPath();
            ctx.moveTo(padding + startP.r * step, padding + startP.c * step);
            ctx.lineTo(padding + endP.r * step, padding + endP.c * step);
            ctx.strokeStyle = "rgba(255, 215, 0, 0.8)";
            ctx.lineWidth = 6;
            ctx.lineCap = "round";
            ctx.stroke();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // 最後落子標記
        if (lastMove && winPath.length === 0) {
            ctx.beginPath();
            ctx.arc(padding + lastMove.r * step, padding + lastMove.c * step, 4, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(231, 76, 60, 0.9)";
            ctx.fill();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        updateAndDrawParticles();
    }

    function drawPiece(i, j, isBlack, scale = 1) {
        const cx = padding + i * step;
        const cy = padding + j * step;
        const radius = 13 * scale;
        
        if (currentSkin === 'animal') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            if (isBlack) {
                // Cat Paw
                ctx.fillStyle = "#333";
                ctx.beginPath(); ctx.arc(0, 2, 7, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(-6, -5, 3, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(-2, -8, 3, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(3, -8, 3, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(7, -5, 3, 0, Math.PI*2); ctx.fill(); 
            } else {
                // Dog Bone
                ctx.fillStyle = "#FFF8DC";
                ctx.strokeStyle = "#DEB887";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(-8, -4, 16, 8, 4);
                ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(-8, -4, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(-8, 4, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(8, -4, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(8, 4, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            }
            ctx.restore();
            return;
        }
        
        if (currentSkin === 'gem') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.beginPath();
            ctx.moveTo(0, -12); ctx.lineTo(10, -4); ctx.lineTo(0, 12); ctx.lineTo(-10, -4);
            ctx.closePath();
            
            let grad = ctx.createLinearGradient(-10, -10, 10, 10);
            if (isBlack) {
                grad.addColorStop(0, "#ff7b7b");
                grad.addColorStop(0.5, "#c0392b");
                grad.addColorStop(1, "#641e16");
            } else {
                grad.addColorStop(0, "#7bffff");
                grad.addColorStop(0.5, "#2980b9");
                grad.addColorStop(1, "#154360");
            }
            ctx.fillStyle = grad; ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(0, -12); ctx.lineTo(4, -4); ctx.lineTo(0, 8); ctx.lineTo(-4, -4); ctx.closePath();
            ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fill();
            ctx.restore();
            return;
        }

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
        
        const isInk = document.getElementById('mainContainer').classList.contains('theme-modern');
        let gd = ctx.createRadialGradient(cx - 3*scale, cy - 3*scale, 2*scale, cx, cy, radius);
        
        if (isBlack) {
            if (isInk) {
                gd.addColorStop(0, "#4a5054"); gd.addColorStop(0.3, "#202426"); gd.addColorStop(1, "#111215");
            } else {
                gd.addColorStop(0, "#5a6166"); gd.addColorStop(0.2, "#232629"); gd.addColorStop(1, "#0a0b0d");
            }
        } else {
            if (isInk) {
                gd.addColorStop(0, "#ffffff"); gd.addColorStop(0.6, "#f2f5f6"); gd.addColorStop(1, "#cfd5d8");
            } else {
                gd.addColorStop(0, "#ffffff"); gd.addColorStop(0.2, "#f0f4f5"); gd.addColorStop(1, "#c5ccd0");
            }
        }
        ctx.fillStyle = gd;
        ctx.fill();
        
        ctx.strokeStyle = isBlack ? "rgba(0,0,0,0.45)" : "rgba(0,0,0,0.18)";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // ==========================================================================
    // 動畫與特效系統
    // ==========================================================================
    
    function spawnParticles(i, j, isBlack) {
        const isInk = document.getElementById('mainContainer').classList.contains('theme-modern');
        const cx = padding + i * step;
        const cy = padding + j * step;
        const color = isInk ? (isBlack ? "#222" : "#eee") : (isBlack ? "#555" : "#ddd");
        
        for(let k=0; k<15; k++) {
            particles.push({
                x: cx, y: cy,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 1.0,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    function updateAndDrawParticles() {
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            
            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1.0;
    }

    function gameLoop() {
        if (particles.length > 0 || animatingPiece || hoverMove) {
            drawBoard();
        }
        requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // ==========================================================================
    // 遊戲玩法邏輯
    // ==========================================================================

    canvas.addEventListener('mousemove', (e) => {
        if (over || !me) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        const i = Math.round((x - padding) / step);
        const j = Math.round((y - padding) / step);
        
        if (i >= 0 && i < size && j >= 0 && j < size && board[i][j] === 0) {
            if (!hoverMove || hoverMove.r !== i || hoverMove.c !== j) {
                hoverMove = {r: i, c: j};
            }
        } else {
            hoverMove = null;
        }
    });

    canvas.addEventListener('mouseleave', () => {
        hoverMove = null;
    });

    canvas.onclick = function(e) {
        if (over || !me) return;
        
        // 座標縮放映射計算 (防止 RWD 缩放點選偏位)
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        
        const i = Math.round((x - padding) / step);
        const j = Math.round((y - padding) / step);
        
        if (i >= 0 && i < size && j >= 0 && j < size && board[i][j] === 0) {
            // 保存歷史紀錄以供悔棋
            saveHistory();
            
            makeMove(i, j, true);
            if (!over) {
                me = false;
                turnVal.textContent = "AI 思考中 (白)";
                setCoachStatus("思索防守中...");
                setTimeout(aiMove, 600);
            }
        }
    };

    function makeMove(i, j, isBlack) {
        board[i][j] = isBlack ? 1 : 2;
        lastMove = {r: i, c: j};
        hoverMove = null;
        animatingPiece = {r: i, c: j, isBlack: isBlack, scale: 2.5, start: Date.now()};
        
        spawnParticles(i, j, isBlack);
        const isInk = document.getElementById('mainContainer').classList.contains('theme-modern');
        AudioSystem.playClack(isInk);

        const colName = String.fromCharCode(65 + i);
        const rowName = 15 - j;
        const moveStr = `${isBlack ? '黑' : '白'} ${colName}${rowName}`;
        recordedMoves.push({
            text: `${recordedMoves.length + 1}. ${moveStr}`,
            boardState: JSON.parse(JSON.stringify(board)),
            historyState: JSON.parse(JSON.stringify(history)),
            lastMoveState: {r: i, c: j}
        });
        updateHistoryUI();

        if (checkWin(i, j, board[i][j])) {
            if (isBlack) {
                triggerCoachSpeech("🎉 挑戰成功！", "太厲害了喵！你突破重圍，完成了完美的五星連珠！真的深具棋士資質呢！", "🎉", "happy");
                turnVal.textContent = "挑戰成功！你贏了！";
                turnVal.style.color = "#27ae60";
            } else {
                triggerCoachSpeech("💀 再接再厲！", "呀...對手一不留神連成一線了，別灰心喵！點擊下方重新開始，我們重振旗鼓！", "😿", "sad");
                turnVal.textContent = "AI 獲勝！再試一次？";
                turnVal.style.color = "#e74c3c";
            }
            over = true;
        }
        drawBoard();
    }

    function checkWin(i, j, c) {
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for (let [dx, dy] of dirs) {
            let count = 1;
            let path = [{r: i, c: j}];
            for (let s of [1, -1]) {
                let ni = i + dx*s, nj = j + dy*s;
                while(ni>=0 && ni<size && nj>=0 && nj<size && board[ni][nj]===c) {
                    path.push({r: ni, c: nj});
                    count++; ni+=dx*s; nj+=dy*s;
                }
            }
            if (count >= 5) {
                winPath = path;
                return true;
            }
        }
        return false;
    }

    function saveHistory() {
        history.push(JSON.stringify({board, lastMove, winPath}));
        if (history.length > 20) history.shift();
    }

    // ==========================================================================
    // 智慧型 AI 對戰與權重計算
    // ==========================================================================

    function aiMove() {
        if (over) return;
        let myScore = Array.from({length:size}, () => Array(size).fill(0));
        let rivalScore = Array.from({length:size}, () => Array(size).fill(0));
        let max = -1;
        let candidates = [];

        const isBeginner = document.getElementById('difficultySelect').value === "beginner";

        for(let i=0; i<size; i++) {
            for(let j=0; j<size; j++) {
                if(board[i][j] === 0) {
                    let myVal = evaluate(i, j, 2);
                    let rivalVal = evaluate(i, j, 1);
                    
                    // 根據難度設定權重
                    if (isBeginner) {
                        rivalVal = rivalVal * 0.45; // 入門級：AI 防堵意圖大幅下降
                        myVal = myVal * 0.8;       // 自主攻擊企圖心也稍微降低
                    }

                    let curScore = Math.max(myVal, rivalVal);
                    if(curScore > max) {
                        max = curScore;
                        candidates = [{r: i, c: j, score: curScore}];
                    } else if(curScore === max) {
                        candidates.push({r: i, c: j, score: curScore});
                    }
                }
            }
        }

        let u = 7, v = 7;
        if (candidates.length > 0) {
            // 入門難度 35% 隨機在玩家落子周邊「隨意散步」下子，增加孩子獲勝的信心
            if (isBeginner && Math.random() < 0.35) {
                let neighbors = [];
                for(let r=0; r<size; r++) {
                    for(let c=0; c<size; c++) {
                        if (board[r][c] === 0 && hasNeighbor(r, c)) {
                            neighbors.push({r, c});
                        }
                    }
                }
                if (neighbors.length > 0) {
                    let randNeigh = neighbors[Math.floor(Math.random() * neighbors.length)];
                    u = randNeigh.r; v = randNeigh.c;
                } else {
                    let chosen = candidates[Math.floor(Math.random() * candidates.length)];
                    u = chosen.r; v = chosen.c;
                }
            } else {
                let chosen = candidates[Math.floor(Math.random() * candidates.length)];
                u = chosen.r; v = chosen.c;
            }
        }

        makeMove(u, v, false);
        if (!over) {
            me = true;
            turnVal.textContent = "您的回合 (黑)";
            setCoachStatus("等待落子...");
        }
    }

    // 檢查鄰近是否有任何子（用於降低AI難度時找周圍空位）
    function hasNeighbor(r, c) {
        for(let dr=-1; dr<=1; dr++) {
            for(let dc=-1; dc<=1; dc++) {
                if (dr===0 && dc===0) continue;
                let nr = r + dr, nc = c + dc;
                if (nr>=0 && nr<size && nc>=0 && nc<size && board[nr][nc]!==0) {
                    return true;
                }
            }
        }
        return false;
    }

    function evaluate(x, y, color) {
        let totalScore = 0;
        const dirs = [[1,0],[0,1],[1,1],[1,-1]];
        for(let [dx, dy] of dirs) {
            let count = 1, block = 0;
            for(let s of [1, -1]) {
                let nx = x + dx*s, ny = y + dy*s;
                while(nx>=0 && nx<size && ny>=0 && ny<size && board[nx][ny] === color) {
                    count++; nx+=dx*s; ny+=dy*s;
                }
                if(nx<0 || nx>=size || ny<0 || ny>=size || (board[nx][ny] !== 0 && board[nx][ny] !== color)) {
                    block++;
                }
            }
            totalScore += getScore(count, block);
        }
        return totalScore;
    }

    function getScore(count, block) {
        if(count >= 5) return 100000;
        if(block === 0) {
            switch(count) {
                case 4: return 15000; // 活四：絕對致勝點
                case 3: return 2000;  // 活三：關鍵做局點
                case 2: return 200;
            }
        } else if(block === 1) {
            switch(count) {
                case 4: return 3000;  // 衝四：必須防禦或進攻
                case 3: return 500;
                case 2: return 20;
            }
        }
        return 0;
    }

    // ==========================================================================
    // 智慧型貓咪教練思路引導 (Hint system)
    // ==========================================================================

    function getCoachAdvice() {
        let playerMax = -1;
        let aiMax = -1;

        for(let i=0; i<size; i++) {
            for(let j=0; j<size; j++) {
                if(board[i][j] === 0) {
                    let pVal = evaluate(i, j, 1);
                    let aVal = evaluate(i, j, 2);
                    playerMax = Math.max(playerMax, pVal);
                    aiMax = Math.max(aiMax, aVal);
                }
            }
        }

        // 對手AI威脅性大增
        if (aiMax >= 15000) {
            return {
                title: "⚠️ 千鈞一髮！",
                text: "不妙了喵！對手已經形成了『活四』，再不堵住，白棋下一步就直接贏了！快仔細檢查是哪裡露出了四連破綻喵！",
                expression: "😰"
            };
        }
        if (aiMax >= 3000) {
            return {
                title: "🧐 防禦警報",
                text: "對手正在悄悄佈局『活三』或『衝四』，如果繼續放置不管，很容易會陷入被動。觀察看看對手棋子聚集的地方，給牠堵個正著喵！",
                expression: "🤔"
            };
        }

        // 我方具有高價值的致勝或佈局點
        if (playerMax >= 15000) {
            return {
                title: "🔥 勝券在握！",
                text: "太棒了喵！黑棋已經形成了『活四』的絕佳殺招！這一步你只要穩穩落子，大師級AI也無法挽救了！快找出這一步喵！",
                expression: "💡"
            };
        }
        if (playerMax >= 2000) {
            return {
                title: "✨ 主動進攻！",
                text: "現在是展開主動權的好時機喵！試著尋找可以幫自己連成『活三』的位置，多線發展，會逼得白棋手忙腳亂喔！",
                expression: "😊"
            };
        }

        // 保底大局觀提示
        return {
            title: "🐾 大局思維",
            text: "五子棋的秘訣是『先占中心，落子相黏』。不要把黑子散落得太開，試著以棋盤中央為大本營，連成一張綿密網子吧喵！",
            expression: "😸"
        };
    }

    // 觸發導師發言動畫與文字
    function triggerCoachSpeech(title, text, emoji, mood="normal") {
        const name = document.getElementById('coachName');
        const bubble = document.getElementById('coachBubble');
        const eyes = document.querySelectorAll('.coach-eye');
        const blush = document.querySelectorAll('.coach-blush');
        const mouth = document.getElementById('coachMouth');
        const sweat = document.getElementById('coachSweat');

        // 表情切換
        if (mood === "happy") {
            eyes.forEach(e => e.setAttribute('fill', '#2b2d2f'));
            blush.forEach(b => b.setAttribute('opacity', '0.9'));
            mouth.setAttribute('d', "M 44,62 Q 50,68 56,62");
            if(sweat) sweat.setAttribute('opacity', '0');
        } else if (mood === "sad" || mood === "sweat") {
            eyes.forEach(e => e.setAttribute('fill', '#2b2d2f')); 
            blush.forEach(b => b.setAttribute('opacity', '0.2'));
            mouth.setAttribute('d', "M 46,65 Q 50,62 54,65");
            if(sweat) sweat.setAttribute('opacity', '1');
        } else {
            eyes.forEach(e => e.setAttribute('fill', '#2b2d2f')); 
            blush.forEach(b => b.setAttribute('opacity', '0.6'));
            mouth.setAttribute('d', "M 46,62 Q 50,65 50,62 Q 50,65 54,62");
            if(sweat) sweat.setAttribute('opacity', '0');
        }

        const isInk = document.getElementById('mainContainer').classList.contains('theme-modern');
        name.textContent = (isInk ? "水墨貓導師" : "孔明貓教練") + " " + emoji;
        
        // 打字機效果
        bubble.textContent = '';
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                bubble.textContent += text.charAt(i);
                i++;
                setTimeout(typeWriter, 15);
            }
        }
        typeWriter();
    }

    function setCoachStatus(status) {
        document.getElementById('coachStatus').textContent = status;
    }

    // ==========================================================================
    // UI 控制與設定事件
    // ==========================================================================

    document.getElementById('themeSwitch').addEventListener('change', function(e) {
        const container = document.getElementById('mainContainer');
        const coachName = document.getElementById('coachName');

        if (e.target.checked) {
            container.classList.add('theme-modern');
            coachName.textContent = "水墨貓導師";

        } else {
            container.classList.remove('theme-modern');
            coachName.textContent = "孔明貓教練";
            const levelSelectVal = document.getElementById('difficultySelect').value;
            document.getElementById('levelValue').textContent = levelSelectVal === "beginner" ? "入門難度" : "大師難度";
        }
        drawBoard();
    });

    document.getElementById('difficultySelect').addEventListener('change', (e) => {
        const val = e.target.value;
        const levelVal = document.getElementById('levelValue');
        levelVal.textContent = val === "beginner" ? "入門難度" : "大師難度";
    });

    document.getElementById('hintBtn').addEventListener('click', () => {
        if (!me || over || isAILocked) return;
        
        const advice = getCoachAdvice();
        triggerCoachSpeech(advice.title, advice.text, advice.expression);
        AudioSystem.playWarning();

        const btn = document.getElementById('hintBtn');
        btn.classList.add('hint-pulse');
        setTimeout(() => btn.classList.remove('hint-pulse'), 1500);
    });

    document.getElementById('undoBtn').addEventListener('click', () => {
        if (history.length === 0 || over || !me) return;
        
        const prevState = JSON.parse(history.pop());
        board = prevState.board;
        lastMove = prevState.lastMove;
        winPath = prevState.winPath;
        
        // 刪除歷史紀錄對應的步數 (玩家和AI共兩步)
        recordedMoves.pop();
        recordedMoves.pop();
        updateHistoryUI();
        drawBoard();
        
        statusTxt ? statusTxt.innerText = "悔棋成功！" : null;
        setCoachStatus("等待落子...");
        triggerCoachSpeech("悔棋成功", "退一步海闊天空喵！這一次在落子前，我們再仔細研究一下棋子之間的關聯吧！", "😊", "happy");
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
        if (confirm("確定要重開一局嗎喵？")) {
            resetGame();
        }
    });

    // 啟動遊戲
    let isAILocked = false;
    
    document.getElementById('skinSelect').addEventListener('change', (e) => {
        currentSkin = e.target.value;
        drawBoard();
    });

    document.getElementById('heatmapSwitch').addEventListener('change', (e) => {
        showHeatmap = e.target.checked;
        drawBoard();
    });

    function updateHistoryUI() {
        const list = document.getElementById('historyList');
        if (!list) return;
        list.innerHTML = '';
        recordedMoves.forEach((move, idx) => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.textContent = move.text;
            item.onclick = () => {
                if(over) return;
                // Click to revert to this specific move state
                board = JSON.parse(JSON.stringify(move.boardState));
                history = JSON.parse(JSON.stringify(move.historyState));
                lastMove = move.lastMoveState;
                winPath = [];
                // truncate recordedMoves
                recordedMoves = recordedMoves.slice(0, idx + 1);
                updateHistoryUI();
                me = (idx % 2 === 1); // 0-based, idx 0 is Black(1st move, next is white)
                if(!me && !over) {
                    turnVal.textContent = "AI 思考中 (白)";
                    setCoachStatus("思索防守中...");
                    setTimeout(aiMove, 600);
                } else {
                    turnVal.textContent = "您的回合 (黑)";
                    turnVal.style.color = "#000000";
                    setCoachStatus("等待落子...");
                }
                drawBoard();
                triggerCoachSpeech("時光倒流！", "我們回到這一步重新開始思考吧喵！", "🕰️");
            };
            list.appendChild(item);
        });
        list.scrollTop = list.scrollHeight;
    }

    resetGame();
</script>

</body>
</html>
